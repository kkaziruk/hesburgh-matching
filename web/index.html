    const run = Engine.runPlans(r.data, weightsFrom(state.opts.levels), PLAN_ORDER, state.pins);
    return PLAN_ORDER.map((k) => run.plans[k]);
  }

  function pin(clubId, prof) {
    state.pins = state.pins.filter(([c]) => c !== clubId).concat([[clubId, prof]]);
    rerun();
    toast(`${prof} is now booked for this club`);
  }
  function unpin(clubId) {
    state.pins = state.pins.filter(([c]) => c !== clubId);
    rerun();
  }

  // ======================================================== frame
  function renderSteps() {
    const order = STEPS.map((s) => s[0]);
    const cur = order.indexOf(state.step);
    $("#steps").innerHTML = STEPS.map(([k, what, hint], i) => {
      const done = i < cur && ready();
      const locked = i > 0 && !ready();
      return `<button type="button" class="step ${done ? "done" : ""}" data-step="${k}" ${state.step === k ? 'aria-current="step"' : ""} ${locked ? "disabled" : ""}>
        <span class="num">${done ? "✓" : i + 1}</span><span style="min-width:0"><span class="what">${what}</span><span class="hint">${hint}</span></span></button>`;
    }).join("");
    $$("[data-step]").forEach((b) => b.onclick = () => go(b.dataset.step));
  }

  function go(step) {
    if (step !== "upload" && !ready()) return;
    state.step = step;
    render();
    $("#stage").scrollTop = 0;
  }

  function frame(title, body, intro, back, next) {
    return `<div class="stage-inner">
      <div class="intro"><span class="i" aria-hidden="true">i</span><div><h1>${title}</h1><p>${intro}</p></div></div>
      <div style="display:grid;gap:18px;align-content:start;min-width:0">${body}</div>
      <div class="foot">${back ? `<button class="btn" type="button" data-go="${back[0]}">← ${back[1]}</button>` : "<span></span>"}
        ${next ? `<button class="btn primary" type="button" data-go="${next[0]}" ${next[2] ? "disabled" : ""}>${next[1]} →</button>` : "<span></span>"}</div>
    </div>`;
  }

  function render() {
    renderSteps();
    const s = $("#stage");
    s.innerHTML = { upload: stepUpload, review: stepReview, fix: stepFix, download: stepDownload }[state.step]();
    wire(s);
  }

  // ======================================================== step 1
  const fieldLabel = (spec) => spec.meaning.split(",")[0].split(" (")[0].split(" '")[0];

  function columnPicker(group, spec, current, headers) {
    const id = `col-${group}-${spec.field}`;
    if (spec.multi) {
      const cur = new Set(Array.isArray(current) ? current : []);
      return `<fieldset class="colpick multi"><legend>${esc(fieldLabel(spec))}</legend>
        <div class="checks">${headers.map((h) => `<label><input type="checkbox" data-col="${group}" data-field="${spec.field}" value="${esc(h)}" ${cur.has(h) ? "checked" : ""}> ${esc(h)}</label>`).join("")}</div></fieldset>`;
    }
    return `<label class="colpick" for="${id}"><span>${esc(fieldLabel(spec))}</span>
      <select id="${id}" data-col="${group}" data-field="${spec.field}"><option value="">${spec.required ? "Choose a column…" : "Not in this file"}</option>
      ${headers.map((h) => `<option ${h === current ? "selected" : ""}>${esc(h)}</option>`).join("")}</select></label>`;
  }

  function missingColumnsCard() {
    const r = R();
    const missing = [];
    for (const [g] of FILES) for (const spec of Engine.COLUMN_SPEC[g]) {
      const v = r.data.columns[g][spec.field];
      if (spec.required && !(Array.isArray(v) ? v.length : v)) missing.push([g, spec]);
    }
    const empty = r.blocking.filter((i) => i.kind === "empty_file");
    return `<div class="card"><div class="card-h"><h2>One more thing before we can match</h2><span class="tag warn">Needs your help</span></div>
      <div class="card-b" style="display:grid;gap:14px">
        ${empty.map((i) => `<p><b>${esc(FILE_NAME[Object.keys(Engine.FILES).find((k) => Engine.FILES[k] === i.subject)] || i.subject)}</b> has no rows in it. Check you saved the right sheet.</p>`).join("")}
        ${missing.length ? `<p>Some column names in your spreadsheets are different from last time, so we couldn't find these. Pick the column that holds each one and matching starts straight away.</p>
        <div class="colgrid">${missing.map(([g, spec]) => `<div><div class="sub" style="margin-bottom:4px">In <b>${FILE_NAME[g]}</b>, usually headed “${esc(spec.label)}”</div>
          ${columnPicker(g, spec, r.data.columns[g][spec.field], r.data.headers[g])}</div>`).join("")}</div>` : ""}
      </div></div>`;
  }

  function stepUpload() {
    const f = state.files, have = FILES.filter(([k]) => f[k]).length;
    const r = R();
    const list = FILES.map(([k, name, desc]) => `<div class="need ${f[k] ? "ok" : ""}">
        <span class="dot" aria-hidden="true">${f[k] ? "✓" : ""}</span>
        <div><b>${name}</b><span class="sub">${desc}</span>
        <div class="status">${f[k] ? `Added${state.usingSample ? " (2026 file)" : `: ${esc(state.names[k] || "")}`}` : "Still needed"}</div></div></div>`).join("");
    let banner = "";
    if (state.uploadMsg) banner = `<div class="banner err">${esc(state.uploadMsg)}</div>`;
    else if (r && r.error) banner = `<div class="banner err">These files couldn't be read: ${esc(r.error)}.</div>`;
    else if (ready()) banner = `<div class="banner"><span>All three files are in. ${r.plan.summary.clubs_matched} of ${r.plan.summary.clubs_total} clubs already have a suggested speaker.</span><button class="btn primary small" type="button" data-go="review">Review the matches →</button></div>`;
    const fixer = r && r.data && !r.plan ? missingColumnsCard() : "";
    const body = `${banner}${fixer}
      <div class="upload">
        <div style="display:grid;gap:14px">
          <div class="drop" id="drop">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
            <strong>Drag the three files here</strong>
            <span class="muted">Excel or CSV files both work. Drop them all at once, in any order.</span>
            <button class="btn primary" type="button" id="choose">Choose files from my computer</button>
          </div>
          <div class="card card-b howto">
            <b>How to get the files</b>
            <ol>
              <li>Find the three spreadsheets: the club requests, the faculty responses and the lecture list.</li>
              <li>If they're Excel files, use them as they are. If they're in Google Sheets, choose <b>File → Download → Microsoft Excel (.xlsx)</b>.</li>
              <li>Drag the three files into the box above.</li>
            </ol>
            <p class="small muted">Your files are read on this computer only. Nothing is uploaded or saved anywhere.</p>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h2>Files needed</h2><span class="tag ${have === 3 ? "good" : "plain"}">${have} of 3 added</span></div>
          <div class="checklist">${list}</div>
          ${SAMPLE || have ? `<div class="card-b" style="border-top:1px solid var(--line);display:grid;gap:8px">
            ${SAMPLE ? `<span class="small muted">Just looking around? Load this year's files to see how it works.</span>` : ""}
            <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${SAMPLE ? `<button class="btn small" type="button" id="use-sample" ${state.usingSample ? "disabled" : ""}>${state.usingSample ? "2026 files loaded" : "Try it with the 2026 files"}</button>` : ""}
            ${have ? `<button class="link small" type="button" id="clear-files">Remove files and start over</button>` : ""}</div>
          </div>` : ""}
        </div>
      </div>`;
    return frame("Step 1: Add the three planning spreadsheets", body,
      "This tool suggests a faculty speaker for every alumni club that asked for a Hesburgh Lecture. To begin, add the club requests, the faculty responses and the lecture list. Matching starts as soon as all three are in.",
      null, ["review", "Next: Review matches", !ready()]);
  }

  // ======================================================== step 2
  function stepReview() {
    const s = R().plan.summary;
    const stats = `<div class="stats">
      <div class="card stat"><span>Clubs with a speaker</span><b>${s.clubs_matched} <small>of ${s.clubs_total}</small></b></div>
      <div class="card stat"><span>Got the talk they ranked 1st</span><b>${s.first_choice_lectures} <small>of ${s.clubs_matched}</small></b></div>
      <div class="card stat"><span>Clubs that need your help</span><b>${s.clubs_unmatched}</b>${s.clubs_unmatched ? `<button class="link" type="button" data-go="fix">See what to do →</button>` : ""}</div>
    </div>`;
    const body = stats + (state.view === "clubs" ? reviewClubs() : reviewProfs());
    return frame("Step 2: Review the suggested speakers", body,
      "Click any club to see who was picked and why. If you'd rather send someone else, choose from the other speakers who fit, and the rest of the plan adjusts automatically. Nothing is final until you download it in Step 4.",
      ["upload", "Back"], ["fix", "Next: Fix problems"]);
  }

  function viewToggle() {
    return `<div class="seg" role="group" aria-label="Show list by"><button type="button" data-view="clubs" aria-pressed="${state.view === "clubs"}">By club</button><button type="button" data-view="profs" aria-pressed="${state.view === "profs"}">By speaker</button></div>`;
  }

  function reviewClubs() {
    const ms = R().plan.matches;
    const q = state.q.trim().toLowerCase();
    const rows = ms.filter((m) => !q || [m.pair.club.name, m.pair.prof.name, m.pair.club.region, m.pair.lectures.map((l) => l[1]).join(" ")].join(" ").toLowerCase().includes(q));
    if (!state.sel || !ms.some((m) => m.pair.club.id === state.sel)) state.sel = (ms[0] || { pair: { club: {} } }).pair.club.id;
    const list = rows.map((m) => `<tr class="row" data-sel="${esc(m.pair.club.id)}" aria-selected="${m.pair.club.id === state.sel}" tabindex="0">
        <td><div class="who">${esc(m.pair.club.name)}</div><div class="sub">${esc(m.pair.club.region)}</div></td>
        <td><div class="who">${esc(m.pair.prof.name)}</div><div class="sub">${m.suggested_month ? `${esc(m.suggested_month)} suggested` : ""}</div></td>
        <td style="text-align:right">${m.pinned ? `<span class="tag gold">Your pick</span>` : m.pair.repeat ? `<span class="tag warn">Repeat</span>` : ""}</td></tr>`).join("");
    return `<div class="review">
      <div class="card listcard">
        <div class="tools"><input class="search" id="q" type="search" placeholder="Find a club or speaker" value="${esc(state.q)}" aria-label="Find a club or speaker">${viewToggle()}</div>
        <div class="scroll"><table class="list"><thead><tr><th>Club</th><th>Suggested speaker</th><th></th></tr></thead>
          <tbody>${list || `<tr><td colspan="3" class="muted" style="padding:24px">No club or speaker matches “${esc(state.q)}”.</td></tr>`}</tbody></table></div>
      </div>
      <div class="card" id="detail">${clubDetail()}</div>
    </div>`;
  }

  const profIndex = (prof) => R().grid.profs.indexOf(prof);
  const eventsOf = (prof) => R().plan.events[profIndex(prof)] || 0;
  const hasRoom = (prof) => eventsOf(prof) < prof.max_events;

  function reasonsFor(pair, month) {
    const out = [];
    if (pair.lectures.length) {
      const [rank, title] = pair.lectures[0];
      out.push(["✓", `Gives the club's ${Engine.ordinal(rank)}-choice talk: <b>${esc(title)}</b>`]);
    } else out.push(["✓", `Speaks on the club's ${Engine.ordinal(pair.choice_rank)}-choice topic: <b>${esc(pair.shared_themes[0])}</b>`]);
    out.push(["✓", `Both are free in <b>${monthsText(pair.shared_months)}</b>${month ? `. Suggested month: <b>${esc(month)}</b>` : ""}`]);
    if (pair.shared_formats.length) out.push(["✓", `Happy to do the club's format: ${esc(pair.shared_formats.join("; "))}`]);
    if (pair.travel) out.push(["✓", "Said they'd like to visit this area"]);
    if (pair.repeat) out.push(["!", "Spoke to this club in the last four years. You may want to choose one of the other speakers below."]);
    return out;
  }

  function clubDetail() {
    const m = R().plan.matches.find((x) => x.pair.club.id === state.sel);
    if (!m) return `<div class="card-b muted">Click a club on the left to see its details.</div>`;
    const { pair } = m, club = pair.club, prof = pair.prof;
    const shared = new Set(pair.shared_months), cm = new Set(club.months);
    const c = R().grid.clubs.indexOf(club);
    const alts = R().grid.forClub(c).filter((p) => p.allowed && p.prof !== prof).sort((a, b) => b.score - a.score).slice(0, 4);
    return `<div class="card-b detail">
      <div><div class="lead">${esc(club.name)}${club.region ? " · " + esc(club.region) : ""}</div><h2>${esc(prof.name)}</h2><div class="sub">${esc(titleOf(prof))} · booked for ${eventsOf(prof)} of the ${plural(prof.max_events, "event")} they offered</div></div>
      <div class="sec"><h3>Why this speaker</h3><ul class="reasons">${reasonsFor(pair, m.suggested_month).map(([ic, t]) => `<li><span class="ic ${ic === "!" ? "w" : ""}">${ic}</span><span>${t}</span></li>`).join("")}</ul></div>
      <div class="sec"><h3>Months</h3>
        <div class="cal">${MONTHS.map((mo) => `<div class="${mo === m.suggested_month ? "both pick" : shared.has(mo) ? "both" : cm.has(mo) ? "club" : ""}" title="${mo}">${mo.slice(0, 3)}</div>`).join("")}</div>
        <div class="cal-key"><span><i class="both pick"></i>Suggested</span><span><i class="both"></i>Both free</span><span><i class="club"></i>Only the club is free</span><span><i></i>Club not free</span></div></div>
      ${club.comments ? `<div class="sec"><h3>Note from the club</h3><p class="quote">${esc(club.comments)}</p></div>` : ""}
      <label class="keep"><input type="checkbox" id="keep" data-club="${esc(club.id)}" data-prof="${esc(prof.name)}" ${m.pinned ? "checked" : ""}> Keep ${esc(lastName(prof.name))} for ${esc(club.name)}, even if I change settings</label>
      <div class="sec"><h3>Other speakers who could do this</h3>
        ${alts.length ? `<div class="options">${alts.map((a) => `<div class="option">
            <div><div class="nm">${esc(a.prof.name)}</div><div class="sub">${a.lectures.length ? `${Engine.ordinal(a.lectures[0][0])}-choice talk: ${esc(a.lectures[0][1])}` : `${Engine.ordinal(a.choice_rank)}-choice topic: ${esc(a.shared_themes[0])}`} · free ${monthsText(a.shared_months)}</div>
              <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">${hasRoom(a.prof) ? `<span class="tag good">Available</span>` : `<span class="tag plain">Already booked elsewhere</span>`}${a.repeat ? `<span class="tag warn">Spoke here recently</span>` : ""}</div></div>
            <button class="btn small" type="button" data-pin="${esc(club.id)}" data-prof="${esc(a.prof.name)}">Choose instead</button></div>`).join("")}</div>
          <p class="small muted">If you choose someone who is already booked elsewhere, that other club gets a new suggestion automatically.</p>`
        : `<p class="muted">No other faculty member fits this club's months and topics.</p>`}
      </div>
      <details class="more"><summary>How the match score was worked out</summary>${scoreMath(pair)}</details>
    </div>`;
  }

  function scoreMath(pair) {
    const w = R().grid.weights, n = (x) => Number(x.toFixed(2));
    const cf = (r) => (r === null ? 1 : Math.max(0.2, 1 - 0.1 * w.choice_rank * (r - 1)));
    const lec = pair.lectures.reduce((s, [r]) => s + cf(r), 0) * 10 * w.lecture_match;
    const th = 5 * w.theme_match * pair.shared_themes.length * cf(pair.choice_rank);
    const mo = 2 * w.month_overlap * pair.shared_months.length, fo = 1 * w.format_match * pair.shared_formats.length;
    const club = pair.club;
    return `<table class="math">
      <tr><td>Talks the club asked for (${pair.lectures.length}, earlier choices count more)</td><td>${n(lec)}</td></tr>
      <tr><td>Topics in common (${pair.shared_themes.length})</td><td>${n(th)}</td></tr>
      <tr><td>Months both are free (${pair.shared_months.length})</td><td>${n(mo)}</td></tr>
      <tr><td>Talk formats in common (${pair.shared_formats.length})</td><td>${n(fo)}</td></tr>
      ${pair.fit - (lec + th + mo + fo) > 0.05 ? `<tr><td>Your team's pick</td><td>${n(pair.fit - (lec + th + mo + fo))}</td></tr>` : ""}
      <tr><td>Times club priority (size ${esc(club.size || "unknown")}, engagement ${club.engagement ?? "unknown"})</td><td>× ${pair.priority.toFixed(2)}</td></tr>
      <tr><td>Times senior speaker boost${pair.priority >= 0.7 ? "" : " (only for top clubs)"}</td><td>× ${pair.boost.toFixed(2)}</td></tr>
      <tr class="total"><td>Match score</td><td>${pair.score.toFixed(1)}</td></tr></table>
      <p class="small muted" style="margin-top:8px">Higher means a better fit. The ${esc(R().plan.label)} plan also weighs serving every club, each club's ranking, repeat speakers and spreading talks across faculty.</p>`;
  }

  function profRows() {
    const r = R(), allowedBy = new Map();
    for (const [, p] of r.grid.allowed()) allowedBy.set(p, (allowedBy.get(p) || 0) + 1);
    return r.grid.profs.map((prof, p) => {
      const n = r.plan.events[p] || 0;
      const status = !prof.lectures.length ? "No lectures on file" : !allowedBy.get(p) ? "No club fits" : n === 0 ? "Available, unassigned" : n >= prof.max_events ? "Full" : "Has room";
      return { prof, p, n, status, booked: r.plan.matches.filter((m) => m.pair.prof === prof) };
    }).sort((a, b) => (b.n - a.n) || (a.prof.name < b.prof.name ? -1 : 1));
  }

  function reviewProfs() {
    const rowsAll = profRows();
    const q = state.q.trim().toLowerCase();
    const rows = rowsAll.filter((x) => !q || [x.prof.name, x.booked.map((m) => m.pair.club.name).join(" ")].join(" ").toLowerCase().includes(q));
    if (!state.selProf || !rowsAll.some((x) => x.prof.name === state.selProf)) state.selProf = (rowsAll[0] || { prof: {} }).prof.name;
    const plain = { "Full": ["good", "All events booked"], "Has room": ["gold", "Can take more"], "Available, unassigned": ["plain", "Not booked yet"], "No club fits": ["warn", "No club fits"], "No lectures on file": ["bad", "No lectures listed"] };
    const list = rows.map((x) => `<tr class="row" data-prof-sel="${esc(x.prof.name)}" aria-selected="${x.prof.name === state.selProf}" tabindex="0">
        <td><div class="who">${esc(x.prof.name)}</div><div class="sub">${esc(titleOf(x.prof))}</div></td>
        <td><div class="load">${Array.from({ length: x.prof.max_events }, (_, k) => `<i class="${k < x.n ? "on" : ""}"></i>`).join("")}</div><div class="sub">${x.n} of ${x.prof.max_events} events</div></td>
        <td style="text-align:right"><span class="tag ${plain[x.status][0]}">${plain[x.status][1]}</span></td></tr>`).join("");
    const x = rowsAll.find((y) => y.prof.name === state.selProf);
    let detail = `<div class="card-b muted">Click a speaker on the left to see their details.</div>`;
    if (x) {
      const prof = x.prof, grid = R().grid;
      const fits = grid.clubs.map((club, c) => grid.at(c, x.p)).filter((pair) => pair.allowed && !x.booked.some((m) => m.pair === pair)).sort((a, b) => b.score - a.score).slice(0, 6);
      const why = x.status === "No lectures on file" ? "This person isn't in the lecture list, so they can't be matched. Add their lectures to the lecture spreadsheet."
        : x.status === "No club fits" ? "None of the clubs asked for their topics in months they're free."
        : "Not booked yet. Other speakers were a closer fit for the clubs that want these topics.";
      detail = `<div class="card-b detail">
        <div><div class="lead">${esc(titleOf(prof))}</div><h2>${esc(prof.name)}</h2><div class="sub">Offered ${plural(prof.max_events, "event")} · free ${monthsText(prof.months)}</div></div>
        <div class="sec"><h3>Booked with</h3>${x.booked.length ? `<ul class="reasons">${x.booked.map((m) => `<li><span class="ic">✓</span><span><b>${esc(m.pair.club.name)}</b>${m.suggested_month ? ` · ${esc(m.suggested_month)}` : ""}<br><span class="sub">${esc(m.pair.lectures.map((l) => l[1]).join("; ") || m.pair.shared_themes.join("; "))}</span></span></li>`).join("")}</ul>` : `<p class="muted">${why}</p>`}</div>
        <div class="sec"><h3>Lectures they offer</h3><ul class="notes">${prof.lectures.map((l) => `<li>${esc(l.title)}</li>`).join("") || "<li>None listed</li>"}</ul></div>
        ${fits.length ? `<div class="sec"><h3>Other clubs that could host them</h3><div class="options">${fits.map((pair) => `<div class="option"><div><div class="nm">${esc(pair.club.name)}</div><div class="sub">free ${monthsText(pair.shared_months)}</div></div><button class="btn small" type="button" data-pin="${esc(pair.club.id)}" data-prof="${esc(prof.name)}">Book for this club</button></div>`).join("")}</div></div>` : ""}
        ${prof.travel_wishes ? `<div class="sec"><h3>Where they'd like to travel</h3><p class="quote">${esc(prof.travel_wishes)}</p></div>` : ""}
      </div>`;
    }
    return `<div class="review">
      <div class="card listcard">
        <div class="tools"><input class="search" id="q" type="search" placeholder="Find a speaker or club" value="${esc(state.q)}" aria-label="Find a speaker or club">${viewToggle()}</div>
        <div class="scroll"><table class="list"><thead><tr><th>Speaker</th><th>Events</th><th></th></tr></thead><tbody>${list}</tbody></table></div>
      </div>
      <div class="card" id="detail">${detail}</div>
    </div>`;
  }

  // ======================================================== step 3
  const PROBLEMS = {
    "No request form submitted": ["These clubs didn't send a request form", ["Contact each club to see whether they'd like a speaker this year.", "If they would, suggest one of the speakers below who still have open slots (speakers who asked to visit that city are listed first).", "Or add their request to the club spreadsheet and add it again in Step 1. Everything re-matches automatically."], "bad"],
    "Missing availability": ["These clubs didn't say which months they can host", ["Contact each club and ask which months work.", "Add the months to the Availability column in the club spreadsheet, then add it again in Step 1."], "bad"],
    "No themes or lectures requested": ["These clubs didn't pick a talk or topic", ["Ask each club to choose up to five talks from the lecture list.", "Add them to the club spreadsheet, then add it again in Step 1."], "bad"],
    "All suitable professors are fully booked": ["Good speakers exist, but they're already fully booked", ["Book one of the speakers below anyway (the club they move from gets a new suggestion), or", "ask a speaker whether they could do one more event, then raise their number in the faculty spreadsheet."], "warn"],
    "Left out so suitable professors are not overloaded": ["A speaker fits, but would be taking on an extra talk", ["The plan held back so faculty aren't overloaded. If you're happy for a speaker to do more, book them below.", "To do this automatically, lower “Share talks across faculty” in Settings."], "warn"],
    "No shared months with any professor": ["No speaker is free in the months these clubs picked", ["Ask the club whether other months would work, or ask a speaker about their availability."], "warn"],
    "No content overlap with any available professor": ["No speaker offers what these clubs asked for", ["Ask the club to pick a different talk from the lecture list. The closest speakers are listed."], "warn"],
  };

  function suggestionLine(u, name, note) {
    const r = R(), c = r.grid.clubs.indexOf(u.club), p = r.grid.profs.findIndex((x) => x.name === name);
    const pair = p >= 0 ? r.grid.at(c, p) : null;
    let sub;
    if (note.startsWith("still free: ")) sub = cap(note.slice(12));
    else if (note.startsWith("near miss: ")) sub = `Close, but ${note.slice(11)}`;
    else if (pair) sub = `${pair.lectures.length ? `${Engine.ordinal(pair.lectures[0][0])}-choice talk` : `${Engine.ordinal(pair.choice_rank)}-choice topic`} · free ${monthsText(pair.shared_months)} · ${hasRoom(pair.prof) ? "available" : "fully booked"}`;
    else sub = note;
    const bookable = pair && pair.allowed;
    return `<div class="option"><div><div class="nm">${esc(name)}</div><div class="sub">${esc(sub)}</div></div>
      ${bookable ? `<button class="btn small" type="button" data-pin="${esc(u.club.id)}" data-prof="${esc(name)}">Book this speaker</button>` : `<span class="tag plain">${note.startsWith("still free") ? "Suggest to the club" : "Not a full fit"}</span>`}</div>`;
  }

  function stepFix() {
    const { plan, data } = R();
    const groups = {};
    plan.unmatched.forEach((u) => (groups[u.reason] = groups[u.reason] || []).push(u));
    const blocks = Object.entries(groups).map(([k, list]) => {
      const [title, todo, tone] = PROBLEMS[k] || [k, [], "plain"];
      return `<div class="card">
        <div class="card-h"><h2>${title}</h2><span class="tag ${tone}">${plural(list.length, "club")}</span></div>
        <div class="card-b"><b>What to do</b><ol class="todo-steps">${todo.map((t) => `<li>${t}</li>`).join("")}</ol></div>
        ${list.map((u, i) => `<details class="problem" ${i === 0 ? "open" : ""}><summary><span><b>${esc(u.club.name)}</b> <span class="sub">${esc(u.club.region)}${u.club.months.length ? ` · free ${monthsText(u.club.months)}` : ""}</span></span>
            <span class="sub">${u.suggestions.length ? plural(u.suggestions.length, "speaker") + " to try" : "No speaker to try"}</span></summary>
          ${u.club.requests.length ? `<div class="sub">Asked for: ${esc(u.club.requests.map((q) => q.title || q.theme).join("; "))}</div>` : ""}
          ${u.suggestions.length ? `<div class="options">${u.suggestions.map(([n, note]) => suggestionLine(u, n, note)).join("")}</div>` : ""}</details>`).join("")}
      </div>`;
    }).join("");
    const issues = Engine.dataIssues(data);
    const fixed = issues.filter((i) => i.kind === "name_mismatch");
    const warns = issues.filter((i) => (i.severity === "error" || i.severity === "warning") && i.kind !== "name_mismatch" && i.kind !== "missing_availability");
    const info = issues.filter((i) => i.severity === "info");
    const line = (i) => `<li><b>${esc(i.subject)}:</b> ${esc(i.message)}</li>`;
    const notes = `<div class="card"><div class="card-h"><h2>Things we noticed in your spreadsheets</h2></div>
      <div class="card-b" style="display:grid;gap:14px">
        ${warns.length ? `<div><b>Please check</b><ul class="notes">${warns.map(line).join("")}</ul></div>` : ""}
        ${fixed.length ? `<details class="more"><summary>${plural(fixed.length, "name was", "names were")} spelled differently between files. We matched them up for you.</summary><ul class="notes">${fixed.map(line).join("")}</ul>
          <p class="small muted" style="margin-top:8px">No action needed. Correcting the spelling in the spreadsheets will keep next year's run clean.</p></details>` : ""}
        ${info.length ? `<details class="more"><summary>${plural(info.length, "other note")}, for your information</summary><ul class="notes">${info.map(line).join("")}</ul></details>` : ""}
        ${!warns.length && !fixed.length ? `<p class="muted">Nothing to check. The spreadsheets look clean.</p>` : ""}
      </div></div>`;
    const pinNotes = plan.pin_notes.length ? `<div class="banner err">${plan.pin_notes.map(esc).join(" ")}</div>` : "";
    const body = plan.unmatched.length
      ? `${pinNotes}<div class="fixes">${blocks}${notes}</div>`
      : `${pinNotes}<div class="banner">Every club has a speaker. There's nothing to fix.</div>${notes}`;
    const n = plan.unmatched.length;
    return frame("Step 3: Help the clubs that don't have a speaker yet", body,
      n ? `${plural(n, "club")} couldn't be matched. They're grouped by reason below, with what to do for each. You can also go on to Step 4 and handle these later.` : "Every club has a suggested speaker.",
      ["review", "Back"], ["download", "Next: Download"]);
  }

  // ======================================================== step 4
  function stepDownload() {
    const { plan } = R(), s = plan.summary, changed = changedLevels();
    const body = `<div class="dl">
      <div class="card"><div class="card-h"><h2>Excel workbook</h2><span class="tag gold">Recommended</span></div>
        <div class="card-b"><p>One file with everything, ready to share with the team:</p>
          <ul><li><b>Summary:</b> totals and the settings used</li><li><b>Matches:</b> each club, its speaker, suggested month, talk and backups</li><li><b>Needs attention:</b> clubs without a speaker, why, and who to try</li><li><b>Faculty:</b> how many events each speaker has</li><li><b>Plan comparison:</b> how the other plans would have done</li><li><b>Data check:</b> spelling fixes and warnings</li></ul>
          <div><button class="btn primary" type="button" id="dl-xlsx">Download Excel workbook</button></div>
          <p class="small muted" id="dl-note" hidden>Saving files isn't available in this view. Open the page in your browser to download.</p></div></div>
      <div class="card"><div class="card-h"><h2>What you're saving</h2></div>
        <div class="card-b"><dl class="facts">
          <dt>Plan</dt><dd>${esc(plan.label)}</dd>
          <dt>Clubs with a speaker</dt><dd>${s.clubs_matched} of ${s.clubs_total}</dd>
          <dt>Got the talk they ranked 1st</dt><dd>${s.first_choice_lectures}</dd>
          <dt>Faculty speaking</dt><dd>${s.profs_used}</dd>
          <dt>Recent repeat speakers</dt><dd>${s.repeat_speakers}</dd>
          <dt>Changes you made</dt><dd>${state.pins.length ? `${plural(state.pins.length, "speaker")} chosen by you` : "None"}</dd>
          <dt>Priorities</dt><dd>${changed.length ? changed.map(([k, v]) => `${esc(PRIORITY[k][1])}: ${v}`).join("; ") : "Standard"}</dd>
          <dt>Files used</dt><dd>${state.usingSample ? "2026 files" : FILES.map(([k]) => esc(state.names[k] || "")).join(", ")}</dd></dl>
          <div><button class="btn small" type="button" id="dl-csv">Download matches only (CSV)</button></div>
        </div></div>
    </div>`;
    return frame("Step 4: Save the results", body,
      "Download the plan to share it or keep a record. If you change anything later, come back here and download again.",
      ["fix", "Back"], null);
  }

  // ======================================================== overlays
  function openModal(html) {
    const o = $("#overlay");
    o.innerHTML = html; o.hidden = false;
    o.onclick = (e) => { if (e.target === o) closeModal(); };
    $$("[data-close]", o).forEach((b) => b.onclick = closeModal);
    const f = $(".x", o); if (f) f.focus();
    return o;
  }
  function closeModal() { $("#overlay").hidden = true; $("#overlay").innerHTML = ""; }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#overlay").hidden) closeModal(); });

  // What the first plan gains over each other plan, in numbers.
  const COMPARE = [
    ["clubs_matched", true, (n) => `${plural(n, "more club gets", "more clubs get")} a speaker`],
    ["first_choice_lectures", true, (n) => `${plural(n, "more club gets", "more clubs get")} their 1st-choice talk`],
    ["requested_lecture_matches", true, (n) => `${plural(n, "more club gets", "more clubs get")} a talk they asked for`],
    ["repeat_speakers", false, (n) => `${plural(n, "fewer repeat speaker")}`],
    ["profs_used", true, (n) => `${plural(n, "more professor shares", "more professors share")} the talks`],
  ];
  function whyBox(plans) {
    const top = plans.find((p) => p.key === "recommended");
    if (!top) return "";
    const lines = [];
    for (const other of plans) {
      if (other === top) continue;
      const gains = [], costs = [];
      for (const [k, higher, phrase] of COMPARE) {
        const d = top.summary[k] - other.summary[k];
        if (!d) continue;
        ((higher ? d > 0 : d < 0) ? gains : costs).push(phrase(Math.abs(d)));
      }
      if (gains.length) lines.push(`<li>Compared with <b>${esc(other.label)}</b>: ${gains.join("; ")}.${costs.length ? ` <span class="muted">Trade-off: ${other.label} has ${costs.join("; ").replace(/more|fewer/g, (w) => (w === "more" ? "fewer" : "more"))}.</span>` : ""}</li>`);
    }
    return lines.length ? `<div class="why"><b>Why Recommended?</b> Not sure which to choose? Start with Recommended. Here's what it gains, in numbers:<ul>${lines.join("")}</ul></div>` : "";
  }

  function settingsPlan(plans) {
    const s = (p) => p.summary;
    return `<div class="q"><b>Which plan should the matcher make?</b><div class="plans">
      ${plans.map((p) => `<label class="radio"><input type="radio" name="plan" value="${p.key}" ${state.opts.plan === p.key ? "checked" : ""}><span><b>${esc(p.label)}${p.key === "recommended" ? ` <span class="tag gold">Recommended</span>` : ""}</b>
        <span class="sub">${esc(p.description)}</span>
        <span class="nums"><span>${s(p).clubs_matched} clubs with a speaker</span><span>${s(p).first_choice_lectures} got their 1st-choice talk</span><span>${plural(s(p).repeat_speakers, "repeat speaker")}</span><span>${s(p).profs_used} faculty speaking</span></span></span></label>`).join("")}</div>
      ${whyBox(plans)}</div>`;
  }

  function settingsPriorities() {
    const lv = state.opts.levels;
    return `<p class="muted small">These decide who wins when two clubs want the same speaker. “Standard” is what most people should use.</p>
      ${PRIORITIES.map(([, title, items]) => `<div class="q"><b>${title}</b><div class="prios">${items.map(([k, label, summary, , explain]) => `<div class="prio">
        <div class="prio-h"><span><b>${esc(label)}</b><span class="sub">${esc(summary)}</span></span>
          <select data-level="${k}" aria-label="${esc(label)}">${LEVELS.map((l) => `<option ${lv[k] === l ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <details class="what"><summary>What does this do?</summary><p>${esc(explain)}</p></details></div>`).join("")}</div></div>`).join("")}`;
  }

  function settingsColumns() {
    const r = R();
    if (!r || !r.data) return `<p class="muted">Add your files in Step 1 first. Then you can check which column the matcher reads for each piece of information.</p>`;
    return `<p class="muted small">You only need this if a spreadsheet's column names changed. The matcher finds columns by name and handles small changes on its own.</p>
      ${FILES.map(([g, name]) => `<details class="more colsec"><summary>${name}</summary><div class="colgrid">
        ${Engine.COLUMN_SPEC[g].map((spec) => columnPicker(g, spec, r.data.columns[g][spec.field], r.data.headers[g])).join("")}</div></details>`).join("")}`;
  }

  function openSettings() {
    const plans = allPlans();
    const tabs = [["plan", "Plan"], ["prio", "Priorities"], ["cols", "Spreadsheet columns"]];
    const body = () => (state.setTab === "plan" ? (plans.length ? settingsPlan(plans) : `<p class="muted">Add your files in Step 1 to compare the plans side by side. You can still pick one now.</p>${settingsPlanNoData()}`)
      : state.setTab === "prio" ? settingsPriorities() : settingsColumns());
    const m = openModal(`<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="set-t">
      <div class="modal-h"><div><h2 id="set-t">Matching settings</h2><p class="muted small">Most people never need to change these. The recommended settings are already on.</p></div><button class="x" type="button" data-close aria-label="Close">×</button></div>
      <div class="modal-tabs seg" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" data-settab="${k}" aria-pressed="${state.setTab === k}">${l}</button>`).join("")}</div>
      <div class="modal-b" id="set-body">${body()}</div>
      <div class="modal-f"><button class="btn" type="button" id="reset">Reset to recommended</button><button class="btn primary" type="button" id="apply">Apply settings</button></div>
    </div>`);
    const pending = { plan: state.opts.plan, levels: Object.assign({}, state.opts.levels), columns: JSON.parse(JSON.stringify(state.columns)) };
    const bind = () => {
      $$("input[name=plan]", m).forEach((r) => r.onchange = () => { pending.plan = r.value; });
      $$("select[data-level]", m).forEach((s) => s.onchange = () => { pending.levels[s.dataset.level] = s.value; });
      bindColumnPickers(m, pending.columns);
    };
    $$("[data-settab]", m).forEach((b) => b.onclick = () => {
      state.setTab = b.dataset.settab;
      $$("[data-settab]", m).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      const save = { plan: state.opts.plan, levels: state.opts.levels };
      state.opts.plan = pending.plan; state.opts.levels = pending.levels;
      $("#set-body", m).innerHTML = body();
      state.opts.plan = save.plan; state.opts.levels = save.levels;
      bind();
    });
    bind();
    $("#reset", m).onclick = () => { state.opts = JSON.parse(JSON.stringify(DEFAULTS)); closeModal(); rerun(); toast("Recommended settings restored"); };
    $("#apply", m).onclick = () => {
      state.opts.plan = pending.plan; state.opts.levels = pending.levels; state.columns = pending.columns;
      closeModal(); rerun();
      toast(ready() ? "Settings applied. Matches updated." : "Settings saved");
    };
  }
  function settingsPlanNoData() {
    return `<div class="q">${PLAN_ORDER.map((k) => `<label class="radio"><input type="radio" name="plan" value="${k}" ${state.opts.plan === k ? "checked" : ""}><span><b>${esc(Engine.MODES[k].label)}</b><span class="sub">${esc(Engine.MODES[k].description)}</span></span></label>`).join("")}</div>`;
  }

  function bindColumnPickers(scope, target) {
    $$("select[data-col]", scope).forEach((s) => s.onchange = () => { target[s.dataset.col][s.dataset.field] = s.value || null; if (target === state.columns) rerun(); });
    $$("input[type=checkbox][data-col]", scope).forEach((cb) => cb.onchange = () => {
      const g = cb.dataset.col, f = cb.dataset.field;
      target[g][f] = $$(`input[data-col="${g}"][data-field="${f}"]:checked`, scope).map((x) => x.value);
      if (target === state.columns) rerun();
    });
  }

  function openHelp() {
    openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="help-t">
      <div class="modal-h"><h2 id="help-t">How this works</h2><button class="x" type="button" data-close aria-label="Close">×</button></div>
      <div class="modal-b">
        <div class="help-sec"><h3>Four steps</h3><ol>
          <li><b>Add files:</b> drag in the club requests, faculty responses and lecture list. Excel or CSV both work.</li>
          <li><b>Review matches:</b> every club gets a suggested speaker and month. Click a club to see why, or choose someone else.</li>
          <li><b>Fix problems:</b> see which clubs have no speaker, and what to do about each.</li>
          <li><b>Download:</b> save an Excel workbook to share with the team.</li></ol></div>
        <div class="help-sec"><h3>The rules every match follows</h3><ul>
          <li>The speaker and the club must both be free in at least one month.</li>
          <li>The speaker must offer a talk or topic the club asked for.</li>
          <li>Each club gets one speaker, and no one is booked for more events than they offered.</li></ul></div>
        <div class="help-sec"><h3>How the Recommended plan chooses</h3><ol>
          <li>Give as many clubs as possible a speaker.</li>
          <li>Then give each club the talk it ranked highest.</li>
          <li>Then avoid sending a club someone it heard in the last four years.</li>
          <li>Then share talks across faculty, honour travel wishes, and pick the best overall fit.</li></ol>
          <p class="small muted">Each goal counts for more than everything below it. Other plans are in Settings, with their numbers side by side.</p></div>
        <div class="help-sec"><h3>Common questions</h3><ul>
          <li><b>Why does a club have no speaker?</b> Usually the club didn't send a request form, or the speakers it wanted were fully booked. Step 3 says which.</li>
          <li><b>Can I change a match?</b> Yes. In Step 2, click the club and pick from “Other speakers who could do this.” Everything else adjusts.</li>
          <li><b>A column in our spreadsheet has a new name.</b> Small changes are handled automatically. If one can't be found, Step 1 asks you to pick it.</li>
          <li><b>Are my files uploaded anywhere?</b> No. Everything happens in this browser window.</li>
          <li><b>Names are spelled differently in two spreadsheets.</b> Close spellings are matched automatically and listed in Step 3.</li></ul></div>
      </div>
      <div class="modal-f"><span></span><button class="btn primary" type="button" data-close>Got it</button></div>
    </div>`);
  }
  $("#open-settings").onclick = openSettings;
  $("#open-help").onclick = openHelp;

  // ======================================================== wiring
  function wire(s) {
    $$("[data-go]", s).forEach((b) => b.onclick = () => go(b.dataset.go));
    $$("[data-view]", s).forEach((b) => b.onclick = () => { state.view = b.dataset.view; state.q = ""; render(); });
    $$("[data-pin]", s).forEach((b) => b.onclick = () => pin(b.dataset.pin, b.dataset.prof));
    bindColumnPickers(s, state.columns);
    const keep = $("#keep", s);
    if (keep) keep.onchange = () => { if (keep.checked) pin(keep.dataset.club, keep.dataset.prof); else { unpin(keep.dataset.club); toast("The matcher may change this pairing again"); } };
    $$("tr[data-sel]", s).forEach((tr) => {
      const pick = () => { state.sel = tr.dataset.sel; refreshDetail(clubDetail); };
      tr.onclick = pick; tr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
    });
    $$("tr[data-prof-sel]", s).forEach((tr) => {
      const pick = () => { state.selProf = tr.dataset.profSel; render(); };
      tr.onclick = pick; tr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
    });
    const q = $("#q", s);
    if (q) q.oninput = (e) => { state.q = e.target.value; const pos = e.target.selectionStart; render(); const nq = $("#q"); nq.focus(); nq.setSelectionRange(pos, pos); };
    const drop = $("#drop", s);
    if (drop) {
      ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
      ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
      drop.addEventListener("drop", (e) => takeFiles([...e.dataTransfer.files]));
      $("#choose", s).onclick = () => $("#file-input").click();
    }
    const us = $("#use-sample", s);
    if (us) us.onclick = () => { state.files = { club: SAMPLE.club, prof: SAMPLE.prof, lecture: SAMPLE.lecture }; state.usingSample = true; state.uploadMsg = null; state.pins = []; state.columns = { club: {}, prof: {}, lecture: {} }; rerun(); toast("2026 files loaded"); };
    const cf = $("#clear-files", s);
    if (cf) cf.onclick = () => { state.files = { club: null, prof: null, lecture: null }; state.names = {}; state.usingSample = false; state.pins = []; state.uploadMsg = null; state.columns = { club: {}, prof: {}, lecture: {} }; rerun(); };
    const x = $("#dl-xlsx", s); if (x) x.onclick = downloadXlsx;
    const c = $("#dl-csv", s); if (c) c.onclick = () => save(`hesburgh_matches_${stamp()}.csv`, toCSV(matchRows()));
    if (state.step === "download") checkDownloads();
  }

  function refreshDetail(fn) {
    $$("tr[data-sel]").forEach((tr) => tr.setAttribute("aria-selected", String(tr.dataset.sel === state.sel)));
    const d = $("#detail");
    d.innerHTML = fn();
    wire(d);
    if (window.matchMedia("(max-width: 900px)").matches) d.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // ======================================================== files
  const csvCell = (v) => { const s = v === null || v === undefined ? "" : String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };

  async function excelToCSV(file) {
    if (typeof ExcelJS === "undefined") throw new Error("Excel support didn't load. Check your internet connection, or save the file as CSV.");
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await file.arrayBuffer());
    const ws = wb.worksheets.find((w) => w.actualRowCount > 1) || wb.worksheets[0];
    if (!ws) return "";
    const rows = [];
    ws.eachRow({ includeEmpty: false }, (row) => {
      const vals = [];
      for (let i = 1; i <= ws.columnCount; i++) {
        const cell = row.getCell(i);
        let v = cell.text;
        if (cell.value instanceof Date) v = cell.value.toISOString().slice(0, 10);
        vals.push(v ?? "");
      }
      rows.push(vals.map(csvCell).join(","));
    });
    return rows.join("\n");
  }

  async function readText(file) {
    if (/\.xls[xm]?$/i.test(file.name)) {
      if (/\.xls$/i.test(file.name)) throw new Error(`${file.name} is an old-style Excel file. Open it and save it as .xlsx or CSV first.`);
      return excelToCSV(file);
    }
    const buf = await file.arrayBuffer();
    try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch (e) { return new TextDecoder("windows-1252").decode(buf); }
  }

  function guessKind(text, name) {
    const k = Engine.sniffKind(text);
    if (k) return k;
    const n = name.toLowerCase();
    if (/club/.test(n)) return "club";
    if (/prof|faculty/.test(n)) return "prof";
    if (/lecture|topic/.test(n)) return "lecture";
    return null;
  }

  async function takeFiles(list) {
    const got = {}, unknown = [], failed = [];
    for (const f of list) {
      try {
        const text = await readText(f);
        const kind = guessKind(text, f.name);
        if (kind) { got[kind] = text; state.names[kind] = f.name; } else unknown.push(f.name);
      } catch (e) { failed.push(e.message); }
    }
    if (!Object.keys(got).length) {
      state.uploadMsg = failed.length ? failed.join(" ") : `We couldn't tell what ${unknown.join(", ") || "that file"} is. Make sure it's one of the three planning spreadsheets.`;
      render(); return;
    }
    if (state.usingSample) { state.files = { club: null, prof: null, lecture: null }; state.usingSample = false; }
    Object.assign(state.files, got);
    state.pins = [];
    state.uploadMsg = failed.length ? failed.join(" ") : unknown.length ? `Skipped ${unknown.join(", ")}: it isn't one of the three planning spreadsheets.` : null;
    rerun();
    const missing = FILES.filter(([k]) => !state.files[k]).map(([, n]) => n.toLowerCase());
    toast(missing.length ? `Got it. Still needed: ${missing.join(" and ")}.` : ready() ? "All three files are in" : "Files added. One more step is shown at the top.");
  }
  $("#file-input").addEventListener("change", (e) => { takeFiles([...e.target.files]); e.target.value = ""; });

  // ======================================================== tables for saving
  function matchRows() {
    const r = R();
    return r.plan.matches.map((m) => {
      const { pair } = m, c = r.grid.clubs.indexOf(pair.club);
      const alts = r.grid.forClub(c).filter((p) => p.allowed && p.prof !== pair.prof).sort((a, b) => b.score - a.score).slice(0, 3);
      const row = {
        "Club": pair.club.name, "Club ID": pair.club.id, "Region": pair.club.region, "Size": pair.club.size, "Engagement": pair.club.engagement ?? "",
        "Speaker": pair.prof.name, "Title": titleOf(pair.prof), "Suggested month": m.suggested_month || "", "Months that work": pair.shared_months.join(", "),
        "Talk": pair.lectures.map((l) => l[1]).join("; "), "Club's choice": pair.choice_rank ? Engine.ordinal(pair.choice_rank) : "",
        "Topic": pair.shared_themes.join("; "), "Format": pair.shared_formats.join("; "), "Why": pair.why(),
        "Repeat speaker": pair.repeat ? "Yes" : "", "Chosen by you": m.pinned ? "Yes" : "",
        "Speaker's events": `${m.prof_events} of ${pair.prof.max_events}`, "Match score": Number(pair.score.toFixed(2)),
      };
      alts.forEach((a, i) => { row[`Backup ${i + 1}`] = `${a.prof.name}${hasRoom(a.prof) ? "" : " (booked)"}`; });
      for (let i = alts.length; i < 3; i++) row[`Backup ${i + 1}`] = "";
      if (pair.club.staff_pick) row["Team's pick"] = pair.club.staff_pick;
      return row;
    });
  }
  function unmatchedRows() {
    return R().plan.unmatched.map((u) => {
      const row = { "Club": u.club.name, "Club ID": u.club.id, "Region": u.club.region, "Problem": (PROBLEMS[u.reason] || [u.reason])[0], "What to do": ((PROBLEMS[u.reason] || [, []])[1]).join(" ") };
      for (let i = 0; i < 3; i++) { const s = u.suggestions[i]; row[`Try ${i + 1}`] = s ? s[0] : ""; row[`Try ${i + 1} note`] = s ? s[1].replace(/^still free: |^near miss: /, "") : ""; }
      return row;
    });
  }
  function facultyRows() {
    return profRows().map((x) => ({ "Speaker": x.prof.name, "Title": titleOf(x.prof), "Events booked": x.n, "Events offered": x.prof.max_events, "Status": x.status,
      "Clubs": x.booked.map((m) => `${m.pair.club.name}${m.suggested_month ? ` (${m.suggested_month})` : ""}`).join("; "),
      "Free months": x.prof.months.length === 12 ? "All year" : x.prof.months.join(", "), "Travel wishes": x.prof.travel_wishes }));
  }
  function comparisonRows() {
    const plans = allPlans(), L = Engine.SUMMARY_LABELS;
    const keys = ["clubs_matched", "first_choice_lectures", "requested_lecture_matches", "repeat_speakers", "profs_used", "max_events_per_prof", "month_clashes", "staff_pick_agreement", "total_score"];
    return keys.map((k) => Object.assign({ "": L[k] }, Object.fromEntries(plans.map((p) => [p.label + (p.key === state.opts.plan ? " (this plan)" : ""), p.summary[k]]))));
  }
  const issueRows = () => Engine.dataIssues(R().data).map((i) => ({ "Type": { error: "Must fix", warning: "Worth a look", info: "For your information" }[i.severity], "About": i.subject, "Note": i.message }));

  // ======================================================== downloads
  let downloads;
  async function checkDownloads() {
    if (downloads === undefined) {
      try { downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { downloads = null; }
    }
    const ok = !!downloads || typeof window.claude === "undefined";
    const x = $("#dl-xlsx"), c = $("#dl-csv"), n = $("#dl-note");
    if (x) x.disabled = !ok || typeof ExcelJS === "undefined";
    if (c) c.disabled = !ok;
    if (n) n.hidden = ok;
  }
  const stamp = () => new Date().toISOString().slice(0, 10);
  async function save(filename, data) {
    if (!downloads) {
      // A normal web page (for example GitHub Pages): plain browser download.
      const blob = data instanceof Blob ? data : new Blob([data], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast("Saved " + filename);
      return;
    }
    try { await downloads.save({ filename, data }); toast("Saved " + filename); }
    catch (e) {
      if (e && e.code === "declined") return;
      toast(e && e.code === "rate_limited" ? "A save is already waiting for you to confirm" : "Saving isn't available here");
    }
  }
  function toCSV(rows) {
    if (!rows.length) return "";
    const cols = Object.keys(rows[0]);
    return "﻿" + [cols.map(csvCell).join(",")].concat(rows.map((r) => cols.map((c) => csvCell(r[c])).join(","))).join("\r\n");
  }

  async function downloadXlsx() {
    const { plan } = R(), L = Engine.SUMMARY_LABELS;
    const wb = new ExcelJS.Workbook();
    const navy = "FF0C2340", band = "FFF4F5F8", gold = "FF8F6C00";
    const sum = wb.addWorksheet("Summary");
    sum.getColumn(1).width = 38; sum.getColumn(2).width = 60;
    sum.getCell("A1").value = "Hesburgh Lecture matches";
    sum.getCell("A1").font = { bold: true, size: 16, color: { argb: navy } };
    sum.getCell("A2").value = `Saved ${stamp()} · ${plan.label} plan`;
    let r = 4;
    const block = (title, pairs) => {
      sum.getCell(r, 1).value = title; sum.getCell(r, 1).font = { bold: true, size: 12, color: { argb: gold } }; r++;
      for (const [k, v] of pairs) { sum.getCell(r, 1).value = k; sum.getCell(r, 1).font = { bold: true }; sum.getCell(r, 2).value = v; sum.getCell(r, 2).alignment = { wrapText: true }; r++; }
      r++;
    };
    block("Results", Object.entries(L).filter(([k]) => k in plan.summary).map(([k, label]) => [label, plan.summary[k]]));
    block("Settings used", [["Plan", `${plan.label}: ${plan.description}`],
      ...Object.entries(PRIORITY).map(([k, p]) => [p[1], state.opts.levels[k]]),
      ["Speakers chosen by you", state.pins.map(([c, p]) => `${(R().grid.clubs.find((x) => x.id === c) || {}).name || c} → ${p}`).join("; ") || "None"]]);
    const sheets = [["Matches", matchRows()], ["Needs attention", unmatchedRows()], ["Faculty", facultyRows()], ["Plan comparison", comparisonRows()], ["Data check", issueRows()]];
    const wide = new Set(["Talk", "Why", "What to do", "Clubs", "Note", "Months that work", "Free months", "Travel wishes", "Topic", "Try 1 note", "Try 2 note", "Try 3 note"]);
    for (const [name, rows] of sheets) {
      const ws = wb.addWorksheet(name, { views: [{ state: "frozen", xSplit: 1, ySplit: 1 }] });
      if (!rows.length) { ws.getCell("A1").value = "Nothing to show."; continue; }
      const cols = Object.keys(rows[0]);
      ws.columns = cols.map((c) => {
        const longest = Math.max(c.length, ...rows.map((x) => String(x[c] ?? "").length));
        return { header: c, key: c, width: Math.min(wide.has(c) ? 48 : 30, Math.max(9, longest + 2)) };
      });
      rows.forEach((x) => ws.addRow(x));
      ws.getRow(1).height = 30;
      ws.getRow(1).eachCell((cell) => {
        cell.font = { bold: true, color: { argb: "FFFFFFFF" } };
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: navy } };
        cell.alignment = { vertical: "middle", wrapText: true };
      });
      ws.eachRow((row, i) => {
        if (i === 1) return;
        row.eachCell({ includeEmpty: true }, (cell, ci) => {
          cell.alignment = { vertical: "top", wrapText: wide.has(cols[ci - 1]) };
          cell.border = { bottom: { style: "thin", color: { argb: "FFDDE2EA" } } };
          if (i % 2 === 0) cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: band } };
        });
      });
      ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: cols.length } };
    }
    const buf = await wb.xlsx.writeBuffer();
    save(`hesburgh_matches_${stamp()}.xlsx`, new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  }

  render();
})();
</script>
