      <div class="modal-tabs seg" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" data-settab="${k}" aria-pressed="${state.setTab === k}">${l}</button>`).join("")}</div>
      <div class="modal-b" id="set-body">${body()}</div>
      <div class="modal-f"><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="reset">Back to standard</button><button class="btn" type="button" id="m-save">Save my settings</button><button class="btn" type="button" id="m-load">Load saved settings</button></span><button class="btn primary" type="button" id="apply">Apply</button></div>
    </div>`);
    const bind = () => {
      const pr = $("#m-preset", m);
      if (pr) pr.onchange = () => { if (pr.value) { pending.levels = presetLevels(pr.value); $("#set-body", m).innerHTML = body(); bind(); } };
      $$("select[data-level]", m).forEach((s) => s.onchange = () => { pending.levels[s.dataset.level] = s.value; const p = $("#m-preset", m); if (p) p.value = matchingPreset(pending.levels) || ""; });
      bindColumnPickers(m, pending.columns);
    };
    $$("[data-settab]", m).forEach((b) => b.onclick = () => {
      state.setTab = b.dataset.settab;
      $$("[data-settab]", m).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      $("#set-body", m).innerHTML = body(); bind();
    });
    bind();
    $("#reset", m).onclick = () => { pending.levels = Object.assign({}, STANDARD_LEVELS); $("#set-body", m).innerHTML = body(); bind(); };
    $("#m-save", m).onclick = () => saveSettings(pending.levels, pending.columns);
    $("#m-load", m).onclick = () => { closeModal(); $("#settings-input").click(); };
    $("#apply", m).onclick = () => {
      state.opts.levels = pending.levels; state.columns = pending.columns;
      closeModal(); rerun();
      toast(ready() ? "Settings applied. Matches updated." : "Settings saved");
    };
  }

  function bindColumnPickers(scope, target) {
    $$("select[data-col]", scope).forEach((s) => s.onchange = () => { target[s.dataset.col][s.dataset.field] = s.value || null; if (target === state.columns) rerun(); });
    $$("input[type=checkbox][data-col]", scope).forEach((cb) => cb.onchange = () => {
      const g = cb.dataset.col, f = cb.dataset.field;
      target[g][f] = $$(`input[data-col="${g}"][data-field="${f}"]:checked`, scope).map((x) => x.value);
      if (target === state.columns) rerun();
    });
  }

  // Settings files: {"plan", "weights", "columns"}. An old weights.json (just numbers) also loads.
  function saveSettings(levels, columns) {
    const doc = { plan: state.opts.plan, preset: matchingPreset(levels) || "Custom", levels, weights: weightsFrom(levels), columns };
    save("hesburgh_settings.json", new Blob([JSON.stringify(doc, null, 2)], { type: "application/json" }));
  }
  async function loadSettings(file) {
    try {
      const doc = JSON.parse(await file.text());
      if (!doc || typeof doc !== "object") throw new Error();
      const raw = doc.weights || doc.columns || doc.levels ? doc.weights || {} : doc;
      const old = { size_weight: "size", eng_weight: "engagement", title_weight: "title" };
      const w = {};
      for (const [k, v] of Object.entries(raw)) if (typeof v === "number" && PRIORITY[old[k] || k]) w[old[k] || k] = v;
      state.opts.levels = doc.levels && typeof doc.levels === "object"
        ? Object.assign({}, STANDARD_LEVELS, Object.fromEntries(Object.entries(doc.levels).filter(([k, v]) => PRIORITY[k] && LEVELS.includes(v))))
        : levelsFrom(Object.assign(weightsFrom(STANDARD_LEVELS), w));
      if (PLAN_ORDER.includes(doc.plan)) state.opts.plan = doc.plan;
      if (doc.columns && typeof doc.columns === "object") state.columns = Object.assign({ club: {}, prof: {}, lecture: {} }, doc.columns);
      rerun();
      toast(`Loaded settings from ${file.name}`);
    } catch (e) { toast("That file isn't a settings file saved from this page."); }
  }
  $("#settings-input").addEventListener("change", (e) => { if (e.target.files[0]) loadSettings(e.target.files[0]); e.target.value = ""; });

  function openHelp() {
    openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="help-t">
      <div class="modal-h"><h2 id="help-t">How this works</h2><button class="x" type="button" data-close aria-label="Close">×</button></div>
      <div class="modal-b">
        <div class="help-sec"><h3>Five steps</h3><ol>
          <li><b>Add files:</b> drag in the club requests, faculty responses and lecture list. Excel or CSV both work.</li>
          <li><b>Choose a plan:</b> see how each plan works out for your files, side by side, and pick one.</li>
          <li><b>Review matches:</b> every club gets a suggested speaker and month. Click a club to see why, or choose someone else.</li>
          <li><b>Fix problems:</b> see which clubs have no speaker, and what to do about each.</li>
          <li><b>Final plan:</b> fine-tune the priorities, watch the numbers change, and download an Excel workbook.</li></ol></div>
        <div class="help-sec"><h3>The rules every match follows</h3><ul>
          <li>The speaker and the club must both be free in at least one month.</li>
          <li>The speaker must offer a talk or topic the club asked for.</li>
          <li>Each club gets one speaker, and no one is booked for more events than they offered.</li></ul></div>
        <div class="help-sec"><h3>How the Recommended plan chooses</h3><ol>
          <li>Give as many clubs as possible a speaker.</li>
          <li>Then give each club the talk it ranked highest.</li>
          <li>Then avoid sending a club someone it heard in the last four years.</li>
          <li>Then share talks across faculty, honour travel wishes, and pick the best overall fit.</li></ol>
          <p class="small muted">Each goal counts for more than everything below it.</p></div>
        <div class="help-sec"><h3>Common questions</h3><ul>
          <li><b>Why does a club have no speaker?</b> Usually the club didn't send a request form, or the speakers it wanted were fully booked. Step 4 says which.</li>
          <li><b>Can I change a match?</b> Yes. In Step 3, click the club and pick from “Other speakers who could do this.” Everything else adjusts.</li>
          <li><b>Can I keep my settings for next year?</b> Yes. Use “Save my settings” on the Final plan page or in Settings, and load the file next time.</li>
          <li><b>A column in our spreadsheet has a new name.</b> Small changes are handled automatically. If one can't be found, Step 1 asks you to pick it.</li>
          <li><b>Are my files uploaded anywhere?</b> No. Everything happens in this browser window.</li></ul></div>
      </div>
      <div class="modal-f"><span></span><button class="btn primary" type="button" data-close>Got it</button></div>
    </div>`);
  }
  $("#open-settings").onclick = openSettings;
  $("#open-help").onclick = openHelp;
  $("#go-home").onclick = () => go("home");

  // ======================================================== wiring
  function wire(s) {
    $$("[data-go]", s).forEach((b) => b.onclick = () => go(b.dataset.go));
    $$("[data-view]", s).forEach((b) => b.onclick = () => { state.view = b.dataset.view; state.q = ""; render(); });
    $$("[data-planview]", s).forEach((b) => b.onclick = () => { state.planView = b.dataset.planview; render(); });
    $$("[data-issues]", s).forEach((b) => b.onclick = () => { state.issueView = b.dataset.issues; render(); });
    $$("[data-restab]", s).forEach((b) => b.onclick = () => { state.resTab = b.dataset.restab; render(); });
    $$("[data-pin]", s).forEach((b) => b.onclick = () => pin(b.dataset.pin, b.dataset.prof));
    $$("input[name=plan]", s).forEach((r) => r.onchange = () => { state.opts.plan = r.value; rerun(); toast(`${Engine.MODES[r.value].label} plan chosen`); });
    bindColumnPickers(s, state.columns);
    // Final plan: every change re-runs at once.
    const tp = $("#t-plan", s); if (tp) tp.onchange = () => { state.opts.plan = tp.value; rerun(); };
    const tr = $("#t-preset", s); if (tr) tr.onchange = () => { if (tr.value) { state.opts.levels = presetLevels(tr.value); rerun(); } };
    if (state.step === "results") {
      $$("select[data-level]", s).forEach((x) => x.onchange = () => { state.opts.levels = Object.assign({}, state.opts.levels, { [x.dataset.level]: x.value }); const open = $$("details.tgroup", s).map((d) => d.open); rerun(); $$("details.tgroup").forEach((d, i) => { d.open = open[i]; }); });
      const rs = $("#t-reset", s); if (rs) rs.onclick = () => { state.opts.levels = Object.assign({}, STANDARD_LEVELS); rerun(); toast("Back to standard settings"); };
      const sv = $("#save-settings", s); if (sv) sv.onclick = () => saveSettings(state.opts.levels, state.columns);
      const ld = $("#load-settings", s); if (ld) ld.onclick = () => $("#settings-input").click();
    }
    const keep = $("#keep", s);
    if (keep) keep.onchange = () => { if (keep.checked) pin(keep.dataset.club, keep.dataset.prof); else { unpin(keep.dataset.club); toast("The matcher may change this pairing again"); } };
    $$("tr[data-sel]", s).forEach((tr) => {
      const pick = () => { state.sel = tr.dataset.sel; refreshDetail(clubDetail); };
      tr.onclick = pick; tr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
    });
    $$("tr[data-prof-sel]", s).forEach((tr) => {
      const pick = () => { state.selProf = tr.dataset.profSel; render(); };
      tr.onclick = pick; tr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
    });
    const q = $("#q", s);
    if (q) q.oninput = (e) => { state.q = e.target.value; const pos = e.target.selectionStart; render(); const nq = $("#q"); nq.focus(); nq.setSelectionRange(pos, pos); };
    const drop = $("#drop", s);
    if (drop) {
      ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
      ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
      drop.addEventListener("drop", (e) => takeFiles([...e.dataTransfer.files]));
      $("#choose", s).onclick = () => $("#file-input").click();
    }
    const us = $("#use-sample", s);
    if (us) us.onclick = () => { state.files = { club: SAMPLE.club, prof: SAMPLE.prof, lecture: SAMPLE.lecture }; state.usingSample = true; state.uploadMsg = null; state.pins = []; state.columns = { club: {}, prof: {}, lecture: {} }; rerun(); toast("2026 files loaded"); };
    const cf = $("#clear-files", s);
    if (cf) cf.onclick = () => { state.files = { club: null, prof: null, lecture: null }; state.names = {}; state.usingSample = false; state.pins = []; state.uploadMsg = null; state.columns = { club: {}, prof: {}, lecture: {} }; rerun(); };
    const x = $("#dl-xlsx", s); if (x) x.onclick = downloadXlsx;
    const c = $("#dl-csv", s); if (c) c.onclick = () => save(`hesburgh_matches_${stamp()}.csv`, toCSV(matchRows()));
    if (state.step === "results") checkDownloads();
  }

  function refreshDetail(fn) {
    $$("tr[data-sel]").forEach((tr) => tr.setAttribute("aria-selected", String(tr.dataset.sel === state.sel)));
    const d = $("#detail");
    d.innerHTML = fn();
    wire(d);
    if (window.matchMedia("(max-width: 900px)").matches) d.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // ======================================================== files
  const csvCell = (v) => { const s = v === null || v === undefined ? "" : String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };

  async function excelToCSV(file) {
    if (typeof ExcelJS === "undefined") throw new Error("Excel support didn't load. Check your internet connection, or save the file as CSV.");
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await file.arrayBuffer());
    const ws = wb.worksheets.find((w) => w.actualRowCount > 1) || wb.worksheets[0];
    if (!ws) return "";
    const rows = [];
    ws.eachRow({ includeEmpty: false }, (row) => {
      const vals = [];
      for (let i = 1; i <= ws.columnCount; i++) {
        const cell = row.getCell(i);
        let v = cell.text;
        if (cell.value instanceof Date) v = cell.value.toISOString().slice(0, 10);
        vals.push(v ?? "");
      }
      rows.push(vals.map(csvCell).join(","));
    });
    return rows.join("\n");
  }

  async function readText(file) {
    if (/\.xls[xm]?$/i.test(file.name)) {
      if (/\.xls$/i.test(file.name)) throw new Error(`${file.name} is an old-style Excel file. Open it and save it as .xlsx or CSV first.`);
      return excelToCSV(file);
    }
    const buf = await file.arrayBuffer();
    try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch (e) { return new TextDecoder("windows-1252").decode(buf); }
  }

  function guessKind(text, name) {
    const k = Engine.sniffKind(text);
    if (k) return k;
    const n = name.toLowerCase();
    if (/club/.test(n)) return "club";
    if (/prof|faculty/.test(n)) return "prof";
    if (/lecture|topic/.test(n)) return "lecture";
    return null;
  }

  async function takeFiles(list) {
    const got = {}, unknown = [], failed = [];
    for (const f of list) {
      try {
        const text = await readText(f);
        const kind = guessKind(text, f.name);
        if (kind) { got[kind] = text; state.names[kind] = f.name; } else unknown.push(f.name);
      } catch (e) { failed.push(e.message); }
    }
    if (!Object.keys(got).length) {
      state.uploadMsg = failed.length ? failed.join(" ") : `We couldn't tell what ${unknown.join(", ") || "that file"} is. Make sure it's one of the three planning spreadsheets.`;
      render(); return;
    }
    if (state.usingSample) { state.files = { club: null, prof: null, lecture: null }; state.usingSample = false; }
    Object.assign(state.files, got);
    state.pins = [];
    state.uploadMsg = failed.length ? failed.join(" ") : unknown.length ? `Skipped ${unknown.join(", ")}: it isn't one of the three planning spreadsheets.` : null;
    rerun();
    const missing = FILES.filter(([k]) => !state.files[k]).map(([, n]) => n.toLowerCase());
    toast(missing.length ? `Got it. Still needed: ${missing.join(" and ")}.` : ready() ? "All three files are in" : "Files added. One more step is shown at the top.");
  }
  $("#file-input").addEventListener("change", (e) => { takeFiles([...e.target.files]); e.target.value = ""; });

  // ======================================================== tables for saving
  function matchRows() {
    const r = R();
    return r.plan.matches.map((m) => {
      const { pair } = m, c = r.grid.clubs.indexOf(pair.club);
      const alts = r.grid.forClub(c).filter((p) => p.allowed && p.prof !== pair.prof).sort((a, b) => b.score - a.score).slice(0, 3);
      const row = {
        "Club": pair.club.name, "Club ID": pair.club.id, "Region": pair.club.region, "Size": pair.club.size, "Engagement": pair.club.engagement ?? "",
        "Speaker": pair.prof.name, "Title": titleOf(pair.prof), "Suggested month": m.suggested_month || "", "Months that work": pair.shared_months.join(", "),
        "Talk": pair.lectures.map((l) => l[1]).join("; "), "Club's choice": pair.choice_rank ? Engine.ordinal(pair.choice_rank) : "",
        "Topic": pair.shared_themes.join("; "), "Format": pair.shared_formats.join("; "), "Why": pair.why(),
        "Repeat speaker": pair.repeat ? "Yes" : "", "Chosen by you": m.pinned ? "Yes" : "",
        "Speaker's events": `${m.prof_events} of ${pair.prof.max_events}`, "Match score": Number(pair.score.toFixed(2)),
      };
      alts.forEach((a, i) => { row[`Backup ${i + 1}`] = `${a.prof.name}${hasRoom(a.prof) ? "" : " (booked)"}`; });
      for (let i = alts.length; i < 3; i++) row[`Backup ${i + 1}`] = "";
      if (pair.club.staff_pick) row["Team's pick"] = pair.club.staff_pick;
      return row;
    });
  }
  function unmatchedRows() {
    return R().plan.unmatched.map((u) => {
      const row = { "Club": u.club.name, "Club ID": u.club.id, "Region": u.club.region, "Problem": (PROBLEMS[u.reason] || [u.reason])[0], "What to do": ((PROBLEMS[u.reason] || [, []])[1]).join(" ") };
      for (let i = 0; i < 3; i++) { const s = u.suggestions[i]; row[`Try ${i + 1}`] = s ? s[0] : ""; row[`Try ${i + 1} note`] = s ? s[1].replace(/^still free: |^near miss: /, "") : ""; }
      return row;
    });
  }
  function facultyRows() {
    return profRows().map((x) => ({ "Speaker": x.prof.name, "Title": titleOf(x.prof), "Events booked": x.n, "Events offered": x.prof.max_events, "Status": x.status,
      "Clubs": x.booked.map((m) => `${m.pair.club.name}${m.suggested_month ? ` (${m.suggested_month})` : ""}`).join("; "),
      "Free months": x.prof.months.length === 12 ? "All year" : x.prof.months.join(", "), "Travel wishes": x.prof.travel_wishes }));
  }
  function comparisonRows() {
    const plans = allPlans(), lead = leaders(plans);
    return MEASURES.map(([k, label]) => Object.assign({ "": label }, Object.fromEntries(plans.map((p) => [p.label + (p.key === state.opts.plan ? " (this plan)" : ""), `${lead[k].has(p.key) ? "★ " : ""}${p.summary[k]}`]))));
  }
  const issueRows = () => Engine.dataIssues(R().data).map((i) => ({ "Type": { error: "Must fix", warning: "Worth a look", info: "For your information" }[i.severity], "About": i.subject, "Note": i.message }));

  // ======================================================== downloads
  let downloads;
  async function checkDownloads() {
    if (downloads === undefined) {
      try { downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { downloads = null; }
    }
    const ok = !!downloads || typeof window.claude === "undefined";
    const x = $("#dl-xlsx"), c = $("#dl-csv"), n = $("#dl-note");
    if (x) x.disabled = !ok || typeof ExcelJS === "undefined";
    if (c) c.disabled = !ok;
    if (n) n.hidden = ok;
  }
  const stamp = () => new Date().toISOString().slice(0, 10);
  async function save(filename, data) {
    if (downloads === undefined) {
      try { downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { downloads = null; }
    }
    if (!downloads) {
      // A normal web page (for example GitHub Pages): plain browser download.
      const blob = data instanceof Blob ? data : new Blob([data], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast("Saved " + filename);
      return;
    }
    try { await downloads.save({ filename, data }); toast("Saved " + filename); }
    catch (e) {
      if (e && e.code === "declined") return;
      toast(e && e.code === "rate_limited" ? "A save is already waiting for you to confirm" : "Saving isn't available here");
    }
  }
  function toCSV(rows) {
    if (!rows.length) return "";
    const cols = Object.keys(rows[0]);
    return "﻿" + [cols.map(csvCell).join(",")].concat(rows.map((r) => cols.map((c) => csvCell(r[c])).join(","))).join("\r\n");
  }

  async function downloadXlsx() {
    const { plan } = R(), L = Engine.SUMMARY_LABELS;
    const wb = new ExcelJS.Workbook();
    const navy = "FF0C2340", band = "FFF4F5F8", gold = "FF8F6C00";
    const sum = wb.addWorksheet("Summary");
    sum.getColumn(1).width = 38; sum.getColumn(2).width = 60;
    sum.getCell("A1").value = "Hesburgh Lecture matches";
    sum.getCell("A1").font = { bold: true, size: 16, color: { argb: navy } };
    sum.getCell("A2").value = `Saved ${stamp()} · ${plan.label} plan`;
    let r = 4;
    const block = (title, pairs) => {
      sum.getCell(r, 1).value = title; sum.getCell(r, 1).font = { bold: true, size: 12, color: { argb: gold } }; r++;
      for (const [k, v] of pairs) { sum.getCell(r, 1).value = k; sum.getCell(r, 1).font = { bold: true }; sum.getCell(r, 2).value = v; sum.getCell(r, 2).alignment = { wrapText: true }; r++; }
      r++;
    };
    block("Results", Object.entries(L).filter(([k]) => k in plan.summary).map(([k, label]) => [label, plan.summary[k]]));
    const settings = [["Plan", `${plan.label}: ${BLURB[plan.key] || plan.description}`], ["Quick setting", matchingPreset(state.opts.levels) || "Custom"],
      ...Object.entries(PRIORITY).map(([k, p]) => [p[1], state.opts.levels[k]]),
      ["Speakers chosen by you", state.pins.map(([c, p]) => `${(R().grid.clubs.find((x) => x.id === c) || {}).name || c} → ${p}`).join("; ") || "None"]];
    const sheets = [["Matches", matchRows()], ["Needs attention", unmatchedRows()], ["Faculty", facultyRows()], ["Plan comparison", comparisonRows()], ["Data check", issueRows()],
      ["Settings used", settings.map(([k, v]) => ({ "Setting": k, "Value": v }))]];
    const wide = new Set(["Talk", "Why", "What to do", "Clubs", "Note", "Months that work", "Free months", "Travel wishes", "Topic", "Try 1 note", "Try 2 note", "Try 3 note", "Value"]);
    for (const [name, rows] of sheets) {
      const ws = wb.addWorksheet(name, { views: [{ state: "frozen", xSplit: 1, ySplit: 1 }] });
      if (!rows.length) { ws.getCell("A1").value = "Nothing to show."; continue; }
      const cols = Object.keys(rows[0]);
      ws.columns = cols.map((c) => {
        const longest = Math.max(c.length, ...rows.map((x) => String(x[c] ?? "").length));
        return { header: c, key: c, width: Math.min(wide.has(c) ? 60 : 30, Math.max(9, longest + 2)) };
      });
      rows.forEach((x) => ws.addRow(x));
      ws.getRow(1).height = 30;
      ws.getRow(1).eachCell((cell) => {
        cell.font = { bold: true, color: { argb: "FFFFFFFF" } };
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: navy } };
        cell.alignment = { vertical: "middle", wrapText: true };
      });
      ws.eachRow((row, i) => {
        if (i === 1) return;
        row.eachCell({ includeEmpty: true }, (cell, ci) => {
          cell.alignment = { vertical: "top", wrapText: wide.has(cols[ci - 1]) };
          cell.border = { bottom: { style: "thin", color: { argb: "FFDDE2EA" } } };
          if (i % 2 === 0) cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: band } };
        });
      });
      ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: cols.length } };
    }
    const buf = await wb.xlsx.writeBuffer();
    save(`hesburgh_matches_${stamp()}.xlsx`, new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  }

  render();
})();
</script>
