<title>Hesburgh Lecture Matcher</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* Layout: a landing page that compares the plans, then a guided five-step tool. Navy header, a step bar under it, and one step on screen at a time with Back and Next at the bottom. */
:root {
  --bg: #f4f5f8;
  --card: #ffffff;
  --text: #14233c;
  --text-2: #586379;
  --line: #dde2ea;
  --navy: #0c2340;
  --navy-2: #1a3a66;
  --on-navy: #ffffff;
  --on-navy-2: #b9c4d8;
  --gold: #c99700;
  --gold-text: #7f6000;
  --gold-soft: #fbf3dc;
  --gold-line: #ecd9a1;
  --good: #1d7a4a;
  --good-soft: #e3f3ea;
  --warn: #93560a;
  --warn-soft: #fcefdc;
  --bad: #b02a22;
  --bad-soft: #fae3e0;
  --shadow: 0 1px 2px rgba(12, 35, 64, .06), 0 6px 18px rgba(12, 35, 64, .06);
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1322; --card: #131d31; --text: #e9eef7; --text-2: #a1acc0; --line: #283550;
    --navy: #08172e; --navy-2: #23477a; --on-navy: #ffffff; --on-navy-2: #a9b6cc;
    --gold: #e0b443; --gold-text: #e9c460; --gold-soft: #2e2711; --gold-line: #5a4a1c;
    --good: #72d39e; --good-soft: #143022; --warn: #f1b866; --warn-soft: #36280f; --bad: #ff8e85; --bad-soft: #3a1c1a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1322; --card: #131d31; --text: #e9eef7; --text-2: #a1acc0; --line: #283550;
  --navy: #08172e; --navy-2: #23477a; --on-navy: #ffffff; --on-navy-2: #a9b6cc;
  --gold: #e0b443; --gold-text: #e9c460; --gold-soft: #2e2711; --gold-line: #5a4a1c;
  --good: #72d39e; --good-soft: #143022; --warn: #f1b866; --warn-soft: #36280f; --bad: #ff8e85; --bad-soft: #3a1c1a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.005em; }
p { margin: 0; }
.muted { color: var(--text-2); }
.small { font-size: 13px; }
[hidden] { display: none !important; }

/* ---------- frame ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
.pad { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.head { background: var(--navy); color: var(--on-navy); display: flex; align-items: center; gap: 16px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
.brand b { display: block; font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.2; }
.brand span { display: block; font-size: 13px; color: var(--on-navy-2); }
.head .spacer { flex: 1; }
.head-btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(255, 255, 255, .25); background: transparent; color: var(--on-navy); border-radius: 8px; padding: 7px 13px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.head-btn:hover { background: rgba(255, 255, 255, .08); }

.steps { background: var(--card); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; border: 0; border-bottom: 3px solid transparent; background: none; padding: 14px 16px 12px; min-width: 0; }
.step:hover { background: var(--bg); }
.step .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; border: 2px solid var(--line); color: var(--text-2); background: var(--card); }
.step .what { display: block; font-weight: 700; font-size: 15px; }
.step .hint { display: block; font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step[aria-current="step"] { border-bottom-color: var(--gold); }
.step[aria-current="step"] .num { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.step.done .num { background: var(--good); border-color: var(--good); color: var(--card); }
.step:disabled { cursor: default; opacity: .55; }
.step:disabled:hover { background: none; }

.stage { min-height: 0; overflow: auto; padding-block: 22px 0; }
.stage-inner { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; min-height: 100%; grid-template-rows: auto 1fr auto; }
.intro { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: 12px; padding: 14px 18px; }
.intro .i { width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: #0c2340; display: grid; place-items: center; font-weight: 800; font-family: var(--serif); }
.intro h1 { font-size: 22px; line-height: 1.25; }
.intro p { margin-top: 4px; max-width: 90ch; }
.foot { position: sticky; bottom: 0; display: flex; justify-content: space-between; gap: 12px; align-items: center; padding-block: 14px max(16px, env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--bg) 30%); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 9px; padding: 10px 18px; font-weight: 600; font-size: 15px; white-space: nowrap; box-shadow: var(--shadow); }
.btn:hover { border-color: var(--text-2); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.btn.primary:hover { background: var(--navy-2); }
.btn.small { padding: 6px 12px; font-size: 13.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.link { border: 0; background: none; padding: 0; font-weight: 600; color: var(--navy-2); text-decoration: underline; text-underline-offset: 3px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .link { color: var(--gold-text); } }
:root[data-theme="dark"] .link { color: var(--gold-text); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.card-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-h h2 { font-size: 18px; }
.card-b { padding: 18px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.gold { background: var(--gold-soft); color: var(--gold-text); }
.tag.plain { border: 1px solid var(--line); color: var(--text-2); }

/* ---------- step 1 ---------- */
.upload { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 34px 20px; display: grid; gap: 10px; justify-items: center; text-align: center; background: var(--card); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--gold); background: var(--gold-soft); }
.drop svg { color: var(--navy-2); }
.drop strong { font-family: var(--serif); font-size: 21px; font-weight: 600; }
.checklist { display: grid; }
.need { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.need:last-child { border-bottom: 0; }
.need .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--text-2); }
.need.ok .dot { background: var(--good); border-color: var(--good); color: var(--card); }
.need b { display: block; }
.need .status { font-size: 13px; margin-top: 2px; color: var(--text-2); }
.need.ok .status { color: var(--good); font-weight: 600; }
.howto { display: grid; gap: 6px; font-size: 14px; }
.howto ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.banner { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; padding: 14px 18px; border-radius: 12px; background: var(--good-soft); color: var(--good); font-weight: 600; }
.banner.err { background: var(--bad-soft); color: var(--bad); }

/* ---------- step 2 ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.stat { padding: 10px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: center; }
.stat b { grid-column: 2; grid-row: 1 / span 2; }
.stat b { font-family: var(--serif); font-size: 28px; font-weight: 600; line-height: 1.1; }
.stat b small { font-size: 17px; color: var(--text-2); font-weight: 600; }
.stat span { font-size: 13.5px; color: var(--text-2); }
.stat .link { font-size: 13.5px; justify-self: start; }
.review { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; min-height: 0; align-items: start; }
.listcard { display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: calc(100vh - 480px); min-height: 340px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.search { flex: 1 1 200px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: var(--bg); }
.seg button { border: 0; background: none; border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 13.5px; color: var(--text-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.scroll { overflow: auto; min-height: 0; }
#detail { max-height: calc(100vh - 480px); min-height: 340px; overflow: auto; }
.list { width: 100%; border-collapse: collapse; }
.list th { position: sticky; top: 0; background: var(--card); text-align: left; font-size: 12.5px; font-weight: 600; color: var(--text-2); padding: 9px 14px; border-bottom: 1px solid var(--line); z-index: 1; }
.list td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.list tr.row { cursor: pointer; }
.list tr.row:hover td { background: var(--bg); }
.list tr.row[aria-selected="true"] td { background: var(--gold-soft); }
.list tr.row[aria-selected="true"] td:first-child { box-shadow: inset 4px 0 0 var(--gold); }
.who { font-weight: 600; }
.sub { font-size: 13px; color: var(--text-2); }
.detail { display: grid; gap: 20px; }
.detail .lead { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--gold-text); }
.detail h2 { font-size: 26px; line-height: 1.2; }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.reasons li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; }
.reasons .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--good-soft); color: var(--good); }
.reasons .ic.w { background: var(--warn-soft); color: var(--warn); }
.sec { display: grid; gap: 10px; }
.sec h3 { font-family: var(--sans); font-size: 14px; font-weight: 700; }
.cal { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.cal div { border: 1px solid var(--line); border-radius: 6px; text-align: center; padding: 6px 0 5px; font-size: 12px; color: var(--text-2); }
.cal div.club { border-color: var(--text-2); }
.cal div.both { background: var(--gold); border-color: var(--gold); color: #0c2340; font-weight: 700; }
.cal-key { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
.cal-key i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--line); margin-right: 6px; vertical-align: -1px; }
.cal-key i.club { border-color: var(--text-2); }
.cal-key i.both { background: var(--gold); border-color: var(--gold); }
.quote { border-left: 3px solid var(--gold); padding: 2px 0 2px 12px; color: var(--text-2); }
.options { display: grid; gap: 10px; }
.option { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
.option .nm { font-weight: 600; }
.keep { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--bg); font-weight: 600; cursor: pointer; }
.keep input { width: 18px; height: 18px; accent-color: var(--navy-2); flex: none; }
details.more summary { cursor: pointer; font-weight: 600; color: var(--text-2); font-size: 14px; }
details.more[open] summary { margin-bottom: 10px; }
.math { width: 100%; border-collapse: collapse; font-size: 14px; }
.math td { padding: 5px 0; border-bottom: 1px dashed var(--line); }
.math td:last-child { text-align: right; }
.math tr.total td { border-bottom: 0; border-top: 2px solid var(--text); font-weight: 700; padding-top: 8px; }
.load { display: flex; gap: 4px; }
.load i { width: 18px; height: 8px; border-radius: 3px; border: 1px solid var(--text-2); }
.load i.on { background: var(--gold); border-color: var(--gold); }

/* ---------- step 3 ---------- */
.fixes { display: grid; gap: 16px; }
.group-list { display: flex; flex-wrap: wrap; gap: 8px; }
.group-list span { border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 14px; background: var(--bg); }
.todo-steps { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.problem { display: grid; gap: 10px; padding: 16px 18px; border-top: 1px solid var(--line); }
.notes { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }

/* ---------- step 4 ---------- */
.dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.dl .card-b { display: grid; gap: 12px; align-content: start; }
.dl ul { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; font-size: 14px; margin: 0; }
.facts dt { color: var(--text-2); }
.facts dd { margin: 0; font-weight: 600; }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8, 16, 30, .5); display: grid; place-items: center; padding: 20px; z-index: 20; }
.modal { background: var(--card); border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); width: min(720px, 100%); max-height: calc(100% - 20px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
.modal-h { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.modal-h h2 { font-size: 22px; }
.modal-b { padding: 18px 22px; overflow: auto; display: grid; gap: 22px; }
.modal-f { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.x { border: 0; background: none; font-size: 26px; line-height: 1; color: var(--text-2); padding: 0 4px; }
.q { display: grid; gap: 8px; }
.q > b { font-size: 15px; }
.radio { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.radio:has(input:checked) { border-color: var(--navy-2); background: var(--bg); }
.radio input { margin: 3px 0 0; accent-color: var(--navy-2); }
.radio span b { display: block; font-weight: 600; }
.sliders { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.sliders label { display: grid; gap: 4px; font-weight: 600; font-size: 14px; }
.sliders output { font-weight: 600; color: var(--gold-text); font-size: 13px; }
input[type="range"] { width: 100%; accent-color: var(--navy-2); }
.help-sec { display: grid; gap: 8px; }
.help-sec h3 { font-size: 18px; }
.help-sec ol, .help-sec ul { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: var(--on-navy); padding: 11px 18px; border-radius: 10px; font-weight: 600; box-shadow: var(--shadow); z-index: 30; max-width: calc(100% - 32px); }

/* ---------- small screens ---------- */
@media (max-width: 900px) {
  .pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .step { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; gap: 4px; padding: 10px 4px; }
  .step .hint { display: none; }
  .step .what { font-size: 12.5px; }
  .upload, .review, .dl { grid-template-columns: minmax(0, 1fr); }
  .listcard { max-height: 60vh; }
  #detail { max-height: none; min-height: 0; overflow: visible; }
  .brand span { display: none; }
  .head-btn .lbl { display: none; }
}
@media (max-width: 560px) {
  .stats { gap: 8px; }
  .stats { grid-template-columns: minmax(0, 1fr); }
  .sliders { grid-template-columns: minmax(0, 1fr); }
  .cal div { font-size: 10px; }
  .intro { grid-template-columns: minmax(0, 1fr); }
  .intro .i { display: none; }
  .option { grid-template-columns: minmax(0, 1fr); }
  .option .btn { justify-self: start; }
}

/* ---------- plan, priorities, columns ---------- */
.modal.wide { width: min(820px, 100%); }
.modal-tabs { margin: 12px 22px 0; justify-self: start; }
.modal { grid-template-rows: auto auto minmax(0, 1fr) auto; }
.nums { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--navy-2); }
.why { border: 1px solid var(--gold-line); background: var(--gold-soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.why ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.prios { display: grid; gap: 10px; }
.prio { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
.prio-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.prio-h b { display: block; font-weight: 600; }
.prio select, .colpick select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
details.what summary { cursor: pointer; font-size: 13px; color: var(--gold-text); font-weight: 600; }
details.what p { margin: 6px 0 0; font-size: 14px; color: var(--text-2); }
.colgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.colpick { display: grid; gap: 4px; font-size: 14px; font-weight: 600; min-width: 0; }
.colpick select { width: 100%; font-weight: 400; }
.colpick.multi { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 0; }
.colpick.multi .checks { display: flex; flex-wrap: wrap; gap: 4px 14px; font-weight: 400; }
details.colsec { border-top: 1px solid var(--line); padding-top: 10px; }
.plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
details.problem > summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; list-style: none; }
details.problem > summary::-webkit-details-marker { display: none; }
details.problem > summary::before { content: "▸"; color: var(--text-2); margin-right: -4px; }
details.problem[open] > summary::before { content: "▾"; }
details.problem > summary > span:first-child { flex: 1; min-width: 0; }
.problem { padding: 12px 18px; }
@media (max-width: 700px) { .plans { grid-template-columns: minmax(0, 1fr); } }
.cal div.pick { box-shadow: inset 0 0 0 2px var(--navy); }
.cal-key i.pick { box-shadow: inset 0 0 0 2px var(--navy); }
@media (max-width: 560px) { .colgrid { grid-template-columns: minmax(0, 1fr); } .prio-h { grid-template-columns: minmax(0, 1fr); } }
/* ---------- landing page ---------- */
.steps { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.brand-btn { border: 0; background: none; color: inherit; padding: 0; text-align: left; cursor: pointer; border-radius: 8px; }
.stage-inner.home { grid-template-rows: auto auto; align-content: start; padding-bottom: 28px; }

/* ---------- plan comparison ---------- */

.ctable .rec { background: var(--gold-soft); }

<script>
(function () {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MONTHS = Engine.MONTHS;
  const FILES = [
    ["club", "Club requests", "The alumni club request form, one row per club (usually called club_info)."],
    ["prof", "Faculty responses", "The faculty survey, one row per professor (usually called prof_info)."],
    ["lecture", "Lecture list", "The list of lectures and who gives them (usually called lecture_info)."],
  ];
  const FILE_NAME = Object.fromEntries(FILES.map(([k, n]) => [k, n]));
  const STEPS = [
    ["upload", "Add files", "The three spreadsheets"],
    ["plan", "Choose a plan", "Compare the outcomes"],
    ["review", "Review matches", "Check each club's speaker"],
    ["fix", "Fix problems", "Clubs without a speaker"],
    ["results", "Final plan", "Fine-tune and download"],
  ];

  // Priorities in plain words: five levels instead of raw numbers.
  const LEVELS = ["Off", "Low", "Standard", "High", "Max"];
  const PRIORITIES = [
    ["who", "Which clubs come first", [
      ["size", "Bigger clubs first", "Larger clubs get the strongest speakers before smaller clubs do.", [0, 0.5, 1, 1.5, 2],
        "Clubs are sized AA (largest) down to F. Turning this up means a large club is more likely to get the speaker it asked for when two clubs want the same professor. Off treats every club the same regardless of size."],
      ["engagement", "Most active clubs first", "Clubs with a higher engagement (HLS) score get priority.", [0, 0.5, 1, 1.5, 2],
        "Each club has an engagement (HLS) score from its activity. Turning this up favours clubs with higher scores when there's competition for a speaker. Off ignores the score."],
      ["title", "Senior speakers for top clubs", "Deans, provosts and directors go to the most engaged clubs.", [0, 0.5, 1, 1.5, 2],
        "Deans, provosts and directors get a small boost so they go to the biggest, most engaged clubs. Off treats every title the same."],
    ]],
    ["what", "What makes a good match", [
      ["choice_rank", "Respect clubs' rankings", "Favour the talk a club ranked 1st over its later picks.", [0, 0.5, 1, 1.5, 2],
        "Clubs list up to five talks in order. At Max, getting a club its 1st choice matters much more than its 3rd. At Off, any talk on the club's list counts the same."],
      ["lecture_match", "Exact talk requested", "An exact requested talk counts more than just the same topic.", [0, 0.5, 1, 1.5, 2],
        "A club can ask for a specific talk or just a topic area. Higher values reward giving clubs the exact talk they named. Lower values are happy with any talk on the right topic."],
      ["theme_match", "Right topic area", "A talk on a topic the club picked counts, even if it isn't the exact talk.", [0, 0.5, 1, 1.5, 2],
        "Clubs pick topic areas such as Arts & Culture. Higher values reward any professor who speaks on a topic the club chose, even without the exact talk. Lower values lean harder on the exact talk."],
      ["month_overlap", "Easy to schedule", "Favour pairs who are both free in many of the same months.", [0, 0.5, 1, 1.5, 2],
        "When a professor and a club share many free months, the event is easier to schedule. Higher values prefer those pairs. They must always share at least one month, whatever this is set to."],
      ["format_match", "Preferred talk format", "Favour professors who offer the format the club asked for.", [0, 0.5, 1, 1.5, 2],
        "Clubs choose formats such as a lecture with Q&A or a fireside chat. Higher values prefer professors who offer that format."],
      ["staff_pick", "Agree with our team's picks", "Favour the speaker your team already pencilled in.", [0, 0.5, 1, 1.5, 2],
        "If your team already pencilled in a speaker for a club (the '2026 Assignment' column), higher values make the plan more likely to keep that choice. Off by default, so the tool gives an independent second opinion."],
    ]],
    ["fair", "Fairness to clubs and faculty", [
      ["repeat_penalty", "Avoid repeat speakers", "Avoid sending a club someone who spoke there in the last four years.", [0, 0.5, 1, 2, 3],
        "Uses the 2022–2025 speaker columns. Higher values steer clubs away from someone they've already heard. Off allows repeats freely. Mainly affects the Recommended and Balanced plans."],
      ["spread", "Share talks across faculty", "Avoid giving one professor several talks while others have none.", [0, 0.5, 1, 2, 3],
        "Professors can offer several talks. Higher values spread talks across more faculty instead of giving a few people most of them. Mainly affects the Recommended and Balanced plans."],
      ["travel_bonus", "Honour travel wishes", "Favour clubs in places professors said they'd like to visit.", [0, 0.5, 1, 2, 3],
        "Professors can name places they'd like to visit. Higher values favour sending them there. Mainly affects the Recommended and Balanced plans."],
    ]],
  ];
  const PRIORITY = Object.fromEntries(PRIORITIES.flatMap(([, , items]) => items.map((p) => [p[0], p])));
  const STANDARD_LEVELS = Object.fromEntries(Object.keys(PRIORITY).map((k) => [k, k === "staff_pick" ? "Off" : "Standard"]));
  const PRESETS = {
    "Standard": {},
    "Big clubs first": { size: "Max", engagement: "Low" },
    "Active clubs first": { engagement: "Max", size: "Low" },
    "Clubs' wishes first": { choice_rank: "Max", lecture_match: "High", title: "Low" },
    "Fresh faces": { repeat_penalty: "Max", spread: "High" },
    "Share the faculty": { spread: "Max", repeat_penalty: "High", travel_bonus: "High" },
    "Keep our picks": { staff_pick: "Max" },
  };
  const presetLevels = (name) => Object.assign({}, STANDARD_LEVELS, PRESETS[name] || {});
  const matchingPreset = (lv) => Object.keys(PRESETS).find((n) => Object.entries(presetLevels(n)).every(([k, v]) => lv[k] === v)) || null;

  const PLAN_ORDER = ["recommended", "most_clubs", "top_choices", "best_fit", "balanced"];
  const BLURB = {
    recommended: "Gives the most clubs a speaker, then each club the talk it ranked highest, with no repeat speakers and talks shared fairly.",
    most_clubs: "Gives the most clubs a speaker, and treats every club the same whatever its size.",
    top_choices: "Gives as many clubs as possible the exact talk they ranked first.",
    best_fit: "The strongest overall fit, favouring big, active clubs.",
    balanced: "Shares talks across more faculty, avoids repeat speakers, and sends professors where they asked to go.",
  };
  // The measures plans are compared on: summary key, label, higher is better, short "best for" name.
  const MEASURES = [
    ["clubs_matched", "Clubs with a speaker", true, "clubs served", "Clubs served"],
    ["first_choice_lectures", "Got the talk they ranked 1st", true, "1st choices", "1st choice"],
    ["requested_lecture_matches", "Got a talk they asked for", true, "requested talks", "Asked-for talk"],
    ["repeat_speakers", "Repeat speakers", false, "fewest repeats", "Repeats"],
    ["profs_used", "Faculty giving talks", true, "sharing talks across faculty", "Faculty used"],
    ["max_events_per_prof", "Most talks for one professor", false, "lightest busiest-professor load", "Busiest prof."],
  ];
  const DEFAULTS = { plan: "recommended", levels: STANDARD_LEVELS };

  const store = {
    get(k, d) { try { const v = localStorage.getItem("hlsm3:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("hlsm3:" + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  };
  const saved = store.get("opts", {});
  const state = {
    files: { club: null, prof: null, lecture: null }, names: {}, usingSample: false, columns: { club: {}, prof: {}, lecture: {} },
    opts: { plan: PLAN_ORDER.includes(saved.plan) ? saved.plan : DEFAULTS.plan, levels: Object.assign({}, STANDARD_LEVELS, saved.levels || {}) },
    pins: [], step: "home", view: "clubs", q: "", sel: null, selProf: null, result: null, uploadMsg: null,
    setTab: "prio", planView: "cards", issueView: "all", resTab: "month", example: null,
  };

  const weightsFrom = (levels) => Object.fromEntries(Object.entries(PRIORITY).map(([k, p]) => [k, p[3][Math.max(0, LEVELS.indexOf(levels[k]))]]));
  function levelsFrom(weights) {
    const out = {};
    for (const [k, p] of Object.entries(PRIORITY)) {
      const v = Number(weights[k] ?? weightsFrom(STANDARD_LEVELS)[k]);
      let best = 0;
      p[3].forEach((x, i) => { if (Math.abs(x - v) < Math.abs(p[3][best] - v)) best = i; });
      out[k] = LEVELS[best];
    }
    return out;
  }
  const changedLevels = () => Object.entries(state.opts.levels).filter(([k, v]) => v !== STANDARD_LEVELS[k]);

  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600);
  }

  const R = () => state.result;
  const ready = () => !!(R() && R().plan);
  const monthsText = (list) => {
    if (!list.length) return "no months given";
    if (list.length === 12) return "any month";
    const idx = list.map((m) => MONTHS.indexOf(m)).sort((a, b) => a - b), out = [];
    for (let i = 0; i < idx.length; i++) {
      let j = i; while (j + 1 < idx.length && idx[j + 1] === idx[j] + 1) j++;
      const a = MONTHS[idx[i]].slice(0, 3), b = MONTHS[idx[j]].slice(0, 3);
      out.push(j - i >= 2 ? `${a}–${b}` : j > i ? `${a}, ${b}` : a);
      i = j;
    }
    return out.join(", ");
  };
  const lastName = (n) => n.split(" ").slice(-1)[0];
  const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);
  const titleOf = (prof) => (prof.title_raw ? prof.title_raw.split(/\r?\n/)[0] : cap(prof.title));
  const plural = (n, w, many) => `${n} ${n === 1 ? w : many || w + "s"}`;

  // ======================================================== engine glue
  function rerun() {
    store.set("opts", state.opts);
    const f = state.files;
    state.result = null;
    if (f.club && f.prof && f.lecture) {
      try {
        const data = Engine.loadInputs(f, state.columns);
        const blocking = data.issues.filter((i) => i.severity === "error" && (i.kind === "missing_column" || i.kind === "empty_file"));
        if (blocking.length || !data.clubs.length || !data.profs.length) state.result = { data, blocking };
        else {
          const run = Engine.runPlans(data, weightsFrom(state.opts.levels), [state.opts.plan], state.pins);
          state.result = { data, blocking, grid: run.grid, plan: run.plans[state.opts.plan] };
        }
      } catch (e) { state.result = { error: e.message }; }
    }
    if (state.step !== "upload" && state.step !== "home" && !ready()) state.step = "upload";
    render();
  }

  // Every plan on the current files and priorities (cached until something changes).
  function allPlans() {
    const r = R();
    if (!r || !r.plan) return [];
    if (!r.all) {
      const run = Engine.runPlans(r.data, weightsFrom(state.opts.levels), PLAN_ORDER, state.pins);
      r.all = PLAN_ORDER.map((k) => run.plans[k]);
    }
    return r.all;
  }
  // The current plan with standard priorities and no hand-picked speakers, to show what tweaks changed.
  function baseline() {
    const r = R();
    if (!r.base) r.base = Engine.runPlans(r.data, weightsFrom(STANDARD_LEVELS), [state.opts.plan], []).plans[state.opts.plan];
    return r.base;
  }
  // Plans for the landing page: the files already added, or this year's files as an example.
  function examplePlans() {
    if (ready()) return { plans: allPlans(), source: state.usingSample ? "this year's 2026 files" : "your files" };
    if (typeof SAMPLE === "undefined" || !SAMPLE) return null;
    if (!state.example) {
      const run = Engine.runPlans(Engine.loadInputs(SAMPLE), weightsFrom(STANDARD_LEVELS), PLAN_ORDER, []);
      state.example = PLAN_ORDER.map((k) => run.plans[k]);
    }
    return { plans: state.example, source: "this year's 2026 files" };
  }

  function pin(clubId, prof) {
    state.pins = state.pins.filter(([c]) => c !== clubId).concat([[clubId, prof]]);
    rerun();
    toast(`${prof} is now booked for this club`);
  }
  function unpin(clubId) {
    state.pins = state.pins.filter(([c]) => c !== clubId);
    rerun();
  }

  // ======================================================== frame
  function renderSteps() {
    const nav = $("#steps");
    nav.hidden = state.step === "home";
    if (nav.hidden) return;
    const order = STEPS.map((s) => s[0]);
    const cur = order.indexOf(state.step);
    nav.innerHTML = STEPS.map(([k, what, hint], i) => {
      const done = i < cur && ready();
      const locked = i > 0 && !ready();
      return `<button type="button" class="step ${done ? "done" : ""}" data-step="${k}" ${state.step === k ? 'aria-current="step"' : ""} ${locked ? "disabled" : ""}>
        <span class="num">${done ? "✓" : i + 1}</span><span style="min-width:0"><span class="what">${what}</span><span class="hint">${hint}</span></span></button>`;
    }).join("");
    $$("[data-step]", nav).forEach((b) => b.onclick = () => go(b.dataset.step));
  }

  function go(step) {
    if (step !== "upload" && step !== "home" && !ready()) return;
    state.step = step;
    render();
    $("#stage").scrollTop = 0;
  }

  function frame(title, body, intro, back, next) {
    return `<div class="stage-inner">
      <div class="intro"><span class="i" aria-hidden="true">i</span><div><h1>${title}</h1><p>${intro}</p></div></div>
      <div style="display:grid;gap:18px;align-content:start;min-width:0">${body}</div>
      <div class="foot">${back ? `<button class="btn" type="button" data-go="${back[0]}">← ${back[1]}</button>` : "<span></span>"}
        ${next ? `<button class="btn primary" type="button" data-go="${next[0]}" ${next[2] ? "disabled" : ""}>${next[1]} →</button>` : "<span></span>"}</div>
    </div>`;
  }

  function render() {
    renderSteps();
    const s = $("#stage");
    s.innerHTML = { home: pageHome, upload: stepUpload, plan: stepPlan, review: stepReview, fix: stepFix, results: stepResults }[state.step]();
    wire(s);
  }

  // ======================================================== charts (one series, labelled bars)
  function bars(items, opts = {}) {
    if (!items.length) return `<p class="muted small">Nothing to show yet.</p>`;
    const max = Math.max(1, ...items.map((x) => x.value));
    return `<div class="bars">${items.map((x) => `<div class="bar-row${x.hi ? " hi" : ""}" title="${esc(x.label)}: ${x.value}${opts.unit ? " " + opts.unit : ""}">
      <span class="bar-l">${esc(x.label)}</span><span class="bar-t"><i style="width:${(100 * x.value / max).toFixed(1)}%"></i></span><span class="bar-v">${x.value}</span></div>`).join("")}</div>`;
  }
  const countsOf = (values, order) => {
    const c = new Map();
    for (const v of values) if (v) c.set(v, (c.get(v) || 0) + 1);
    const keys = order ? order.filter((k) => c.has(k)) : [...c.keys()].sort((a, b) => c.get(b) - c.get(a) || (a < b ? -1 : 1));
    return keys.map((k) => ({ label: k, value: c.get(k) }));
  };

  // ======================================================== plan comparison
  function leaders(plans) {
    const out = {};
    for (const [k, , higher] of MEASURES) {
      const vals = plans.map((p) => p.summary[k]);
      const target = higher ? Math.max(...vals) : Math.min(...vals);
      out[k] = vals.every((v) => v === target) ? new Set() : new Set(plans.filter((p) => p.summary[k] === target).map((p) => p.key));
    }
    return out;
  }
  const COMPARE = {
    clubs_matched: (n) => `${plural(n, "more club gets", "more clubs get")} a speaker`,
    first_choice_lectures: (n) => `${plural(n, "more club gets", "more clubs get")} the talk they ranked 1st`,
    requested_lecture_matches: (n) => `${plural(n, "more club gets", "more clubs get")} a talk they asked for`,
    repeat_speakers: (n) => `${plural(n, "fewer repeat speaker")}`,
    profs_used: (n) => `${plural(n, "more professor shares", "more professors share")} the talks`,
    max_events_per_prof: (n) => `the busiest professor gives ${plural(n, "fewer talk")}`,
  };
  const COMPARE_COST = {
    clubs_matched: (n) => `${plural(n, "more club gets", "more clubs get")} a speaker`,
    first_choice_lectures: (n) => `${plural(n, "more club gets", "more clubs get")} their 1st choice`,
    requested_lecture_matches: (n) => `${plural(n, "more club gets", "more clubs get")} a talk they asked for`,
    repeat_speakers: (n) => `there ${n === 1 ? "is" : "are"} ${plural(n, "fewer repeat speaker")}`,
    profs_used: (n) => `${plural(n, "more professor shares", "more professors share")} the talks`,
    max_events_per_prof: (n) => `the busiest professor gives ${plural(n, "fewer talk")}`,
  };
  function whyBox(plans) {
    const top = plans.find((p) => p.key === "recommended");
    if (!top) return "";
    const lines = [];
    for (const other of plans) {
      if (other === top) continue;
      const gains = [], costs = [];
      for (const [k, , higher] of MEASURES) {
        const d = top.summary[k] - other.summary[k];
        if (!d) continue;
        if (higher ? d > 0 : d < 0) gains.push(COMPARE[k](Math.abs(d)));
        else costs.push(COMPARE_COST[k](Math.abs(d)));
      }
      if (gains.length) lines.push(`<li>Compared with <b>${esc(other.label)}</b>: ${gains.join("; ")}.${costs.length ? ` <span class="muted">Trade-off: with ${esc(other.label)}, ${costs.join("; ")}.</span>` : ""}</li>`);
    }
    return lines.length ? `<div class="why"><b>Why Recommended?</b> Not sure which to choose? Start with Recommended. Here's what it gains, in numbers:<ul>${lines.join("")}</ul></div>` : "";
  }

  function compareTable(plans, opts = {}) {
    const lead = leaders(plans), total = plans[0].summary.clubs_total;
    return `<div class="ctable-wrap"><table class="ctable">
      <thead><tr><th></th>${plans.map((p) => `<th class="${p.key === "recommended" ? "rec" : ""}${opts.pick && p.key === state.opts.plan ? " cur" : ""}">${esc(p.label)}</th>`).join("")}</tr></thead>
      <tbody>${MEASURES.map(([k, label]) => `<tr><th>${label}</th>${plans.map((p) => {
        const v = p.summary[k], win = lead[k].has(p.key);
        return `<td class="${p.key === "recommended" ? "rec" : ""}${win ? " win" : ""}">${win ? `<span class="star" aria-label="best">★</span>` : ""}${v}${k === "clubs_matched" ? `<small> of ${total}</small>` : ""}</td>`;
      }).join("")}</tr>`).join("")}</tbody></table></div>`;
  }

  function planCard(p, lead, opts = {}) {
    const wins = MEASURES.filter(([k]) => lead[k].has(p.key)).map((m) => m[3]);
    const s = p.summary, base = opts.base && opts.base[p.key];
    const delta = (k, higher) => {
      if (!base) return "";
      const d = s[k] - base.summary[k];
      return d ? `<span class="d ${(d > 0) === higher ? "good" : "bad"}">${d > 0 ? "+" : "−"}${Math.abs(d)}</span>` : "";
    };
    return `<label class="pcard${p.key === "recommended" ? " rec" : ""}">
      <input type="radio" name="plan" value="${p.key}" ${state.opts.plan === p.key ? "checked" : ""}>
      <span class="pcard-h"><b>${esc(p.label)}</b>${p.key === "recommended" ? `<span class="tag gold">Suits most years</span>` : ""}</span>
      <span class="sub">${esc(BLURB[p.key] || p.description)}</span>
      <span class="best">${wins.length ? `<b>Best for</b> ${wins.join(", ")}` : `<span class="muted">Doesn't lead on any measure</span>`}</span>
      <span class="pnums">${MEASURES.map(([k, label, higher, , short]) => `<span class="${lead[k].has(p.key) ? "win" : ""}" title="${label}"><em>${short}</em><b>${lead[k].has(p.key) ? "★ " : ""}${s[k]}</b>${delta(k, higher)}</span>`).join("")}</span>
    </label>`;
  }

  // ======================================================== home
  function pageHome() {
    const ex = examplePlans();
    let outcomes;
    if (ex) {
      outcomes = `<div class="card"><div class="card-h"><h2>What the different plans give you</h2><span class="sub">Using ${esc(ex.source)}</span></div>
        <div class="card-b" style="display:grid;gap:14px">
          <p class="muted small">There are several ways to share out speakers. Each column is a complete plan. A gold ★ marks the plan that does best on each line.</p>
          ${compareTable(ex.plans)}
          ${whyBox(ex.plans)}
        </div></div>`;
    } else {
      outcomes = `<div class="card"><div class="card-h"><h2>The plans you can choose from</h2></div>
        <div class="card-b"><div class="plist">${PLAN_ORDER.map((k) => `<div><b>${esc(Engine.MODES[k].label)}</b>${k === "recommended" ? ` <span class="tag gold">Recommended</span>` : ""}<div class="sub">${esc(BLURB[k])}</div></div>`).join("")}</div>
        <p class="small muted" style="margin-top:12px">Add your spreadsheets and this page shows how many clubs each plan serves, side by side.</p></div></div>`;
    }
    return `<div class="stage-inner home">
      <section class="hero">
        <div class="kicker">Notre Dame Alumni Association · Hesburgh Lecture Series</div>
        <h1>Find the right faculty speaker for every alumni club</h1>
        <p>Add the three planning spreadsheets. The matcher suggests a speaker and a month for every club that asked for a lecture, explains each choice, and gives you a finished Excel plan.</p>
        <div class="hero-steps">${STEPS.map(([, what, hint], i) => `<div><span class="num">${i + 1}</span><b>${what}</b><span class="sub">${hint}</span></div>`).join("")}</div>
        <div class="hero-cta"><button class="btn primary big" type="button" data-go="upload">${ready() ? "Continue matching" : "Start matching"} →</button>
          <span class="small muted">Nothing to install. Your files stay on this computer.</span></div>
      </section>
      ${outcomes}
    </div>`;
  }

  // ======================================================== step 1
  const fieldLabel = (spec) => spec.meaning.split(",")[0].split(" (")[0].split(" '")[0];

  function columnPicker(group, spec, current, headers) {
    const id = `col-${group}-${spec.field}`;
    if (spec.multi) {
      const cur = new Set(Array.isArray(current) ? current : []);
      return `<fieldset class="colpick multi"><legend>${esc(fieldLabel(spec))}</legend>
        <div class="checks">${headers.map((h) => `<label><input type="checkbox" data-col="${group}" data-field="${spec.field}" value="${esc(h)}" ${cur.has(h) ? "checked" : ""}> ${esc(h)}</label>`).join("")}</div></fieldset>`;
    }
    return `<label class="colpick" for="${id}"><span>${esc(fieldLabel(spec))}</span>
      <select id="${id}" data-col="${group}" data-field="${spec.field}"><option value="">${spec.required ? "Choose a column…" : "Not in this file"}</option>
      ${headers.map((h) => `<option ${h === current ? "selected" : ""}>${esc(h)}</option>`).join("")}</select></label>`;
  }

  function missingColumnsCard() {
    const r = R();
    const missing = [];
    for (const [g] of FILES) for (const spec of Engine.COLUMN_SPEC[g]) {
      const v = r.data.columns[g][spec.field];
      if (spec.required && !(Array.isArray(v) ? v.length : v)) missing.push([g, spec]);
    }
    const empty = r.blocking.filter((i) => i.kind === "empty_file");
    return `<div class="card"><div class="card-h"><h2>One more thing before we can match</h2><span class="tag warn">Needs your help</span></div>
      <div class="card-b" style="display:grid;gap:14px">
        ${empty.map((i) => `<p><b>${esc(FILE_NAME[Object.keys(Engine.FILES).find((k) => Engine.FILES[k] === i.subject)] || i.subject)}</b> has no rows in it. Check you saved the right sheet.</p>`).join("")}
        ${missing.length ? `<p>Some column names in your spreadsheets are different from last time, so we couldn't find these. Pick the column that holds each one and matching starts straight away.</p>
        <div class="colgrid">${missing.map(([g, spec]) => `<div><div class="sub" style="margin-bottom:4px">In <b>${FILE_NAME[g]}</b>, usually headed “${esc(spec.label)}”</div>
          ${columnPicker(g, spec, r.data.columns[g][spec.field], r.data.headers[g])}</div>`).join("")}</div>` : ""}
      </div></div>`;
  }

  function stepUpload() {
    const f = state.files, have = FILES.filter(([k]) => f[k]).length;
    const r = R();
    const list = FILES.map(([k, name, desc]) => `<div class="need ${f[k] ? "ok" : ""}">
        <span class="dot" aria-hidden="true">${f[k] ? "✓" : ""}</span>
        <div><b>${name}</b><span class="sub">${desc}</span>
        <div class="status">${f[k] ? `Added${state.usingSample ? " (2026 file)" : `: ${esc(state.names[k] || "")}`}` : "Still needed"}</div></div></div>`).join("");
    let banner = "";
    if (state.uploadMsg) banner = `<div class="banner err">${esc(state.uploadMsg)}</div>`;
    else if (r && r.error) banner = `<div class="banner err">These files couldn't be read: ${esc(r.error)}.</div>`;
    else if (ready()) banner = `<div class="banner"><span>All three files are in. Next, choose which plan you'd like.</span><button class="btn primary small" type="button" data-go="plan">Choose a plan →</button></div>`;
    const fixer = r && r.data && !r.plan ? missingColumnsCard() : "";
    const body = `${banner}${fixer}
      <div class="upload">
        <div style="display:grid;gap:14px">
          <div class="drop" id="drop">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
            <strong>Drag the three files here</strong>
            <span class="muted">Excel or CSV files both work. Drop them all at once, in any order.</span>
            <button class="btn primary" type="button" id="choose">Choose files from my computer</button>
          </div>
          <div class="card card-b howto">
            <b>How to get the files</b>
            <ol>
              <li>Find the three spreadsheets: the club requests, the faculty responses and the lecture list.</li>
              <li>If they're Excel files, use them as they are. If they're in Google Sheets, choose <b>File → Download → Microsoft Excel (.xlsx)</b>.</li>
              <li>Drag the three files into the box above.</li>
            </ol>
            <p class="small muted">Your files are read on this computer only. Nothing is uploaded or saved anywhere.</p>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h2>Files needed</h2><span class="tag ${have === 3 ? "good" : "plain"}">${have} of 3 added</span></div>
          <div class="checklist">${list}</div>
          ${SAMPLE || have ? `<div class="card-b" style="border-top:1px solid var(--line);display:grid;gap:8px">
            ${SAMPLE ? `<span class="small muted">Just looking around? Load this year's files to see how it works.</span>` : ""}
            <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${SAMPLE ? `<button class="btn small" type="button" id="use-sample" ${state.usingSample ? "disabled" : ""}>${state.usingSample ? "2026 files loaded" : "Try it with the 2026 files"}</button>` : ""}
            ${have ? `<button class="link small" type="button" id="clear-files">Remove files and start over</button>` : ""}</div>
          </div>` : ""}
        </div>
      </div>`;
    return frame("Step 1: Add the three planning spreadsheets", body,
      "Add the club requests, the faculty responses and the lecture list. Matching starts as soon as all three are in.",
      ["home", "Home"], ["plan", "Next: Choose a plan", !ready()]);
  }

  // ======================================================== step 2: choose a plan
  function stepPlan() {
    const plans = allPlans(), lead = leaders(plans);
    const toggle = `<div class="seg" role="group" aria-label="Show plans as"><button type="button" data-planview="cards" aria-pressed="${state.planView === "cards"}">Side by side</button><button type="button" data-planview="charts" aria-pressed="${state.planView === "charts"}">As charts</button></div>`;
    let body;
    if (state.planView === "charts") {
      const chart = (k, title, note) => `<div class="card"><div class="card-h"><h2>${title}</h2><span class="sub">${note}</span></div><div class="card-b">${bars(plans.map((p) => ({ label: p.label, value: p.summary[k], hi: p.key === state.opts.plan })))}</div></div>`;
      body = `<div class="charts2">${chart("clubs_matched", "Clubs that get a speaker", "More is better")}${chart("first_choice_lectures", "Clubs getting the talk they ranked 1st", "More is better")}${chart("repeat_speakers", "Repeat speakers", "Fewer is better")}${chart("profs_used", "Faculty giving at least one talk", "More shares the work")}</div>
        <p class="small muted">The highlighted bar is the plan you've picked. Switch to “Side by side” to pick a different one.</p>`;
    } else {
      body = `<div class="pcards">${plans.map((p) => planCard(p, lead)).join("")}</div>${whyBox(plans)}`;
    }
    return frame("Step 2: Choose a plan", `<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><span class="muted">A gold ★ shows which plan does best on each line.</span>${toggle}</div>${body}`,
      "Each plan below is a complete set of matches for your files, made with a different goal in mind. Pick one. Recommended suits most years. You can change your mind at any time.",
      ["upload", "Back"], ["review", "Next: Review matches"]);
  }

  // ======================================================== step 3: review
  function stepReview() {
    const s = R().plan.summary;
    const stats = `<div class="stats">
      <div class="card stat"><span>Clubs with a speaker</span><b>${s.clubs_matched} <small>of ${s.clubs_total}</small></b></div>
      <div class="card stat"><span>Got the talk they ranked 1st</span><b>${s.first_choice_lectures} <small>of ${s.clubs_matched}</small></b></div>
      <div class="card stat"><span>Clubs that need your help</span><b>${s.clubs_unmatched}</b>${s.clubs_unmatched ? `<button class="link" type="button" data-go="fix">See what to do →</button>` : ""}</div>
    </div>`;
    const body = stats + (state.view === "clubs" ? reviewClubs() : reviewProfs());
    return frame(`Step 3: Review the ${esc(R().plan.label)} plan`, body,
      "Click any club to see who was picked and why. If you'd rather send someone else, choose from the other speakers who fit, and the rest of the plan adjusts automatically.",
      ["plan", "Back"], ["fix", "Next: Fix problems"]);
  }

  function viewToggle() {
    return `<div class="seg" role="group" aria-label="Show list by"><button type="button" data-view="clubs" aria-pressed="${state.view === "clubs"}">By club</button><button type="button" data-view="profs" aria-pressed="${state.view === "profs"}">By speaker</button></div>`;
  }

  function reviewClubs() {
    const ms = R().plan.matches;
    const q = state.q.trim().toLowerCase();
    const rows = ms.filter((m) => !q || [m.pair.club.name, m.pair.prof.name, m.pair.club.region, m.pair.lectures.map((l) => l[1]).join(" ")].join(" ").toLowerCase().includes(q));
    if (!state.sel || !ms.some((m) => m.pair.club.id === state.sel)) state.sel = (ms[0] || { pair: { club: {} } }).pair.club.id;
    const list = rows.map((m) => `<tr class="row" data-sel="${esc(m.pair.club.id)}" aria-selected="${m.pair.club.id === state.sel}" tabindex="0">
        <td><div class="who">${esc(m.pair.club.name)}</div><div class="sub">${esc(m.pair.club.region)}</div></td>
        <td><div class="who">${esc(m.pair.prof.name)}</div><div class="sub">${m.suggested_month ? `${esc(m.suggested_month)} suggested` : ""}</div></td>
        <td style="text-align:right">${m.pinned ? `<span class="tag gold">Your pick</span>` : m.pair.repeat ? `<span class="tag warn">Repeat</span>` : ""}</td></tr>`).join("");
    return `<div class="review">
      <div class="card listcard">
        <div class="tools"><input class="search" id="q" type="search" placeholder="Find a club or speaker" value="${esc(state.q)}" aria-label="Find a club or speaker">${viewToggle()}</div>
        <div class="scroll"><table class="list"><thead><tr><th>Club</th><th>Suggested speaker</th><th></th></tr></thead>
          <tbody>${list || `<tr><td colspan="3" class="muted" style="padding:24px">No club or speaker matches “${esc(state.q)}”.</td></tr>`}</tbody></table></div>
      </div>
      <div class="card" id="detail">${clubDetail()}</div>
    </div>`;
  }

  const profIndex = (prof) => R().grid.profs.indexOf(prof);
  const eventsOf = (prof) => R().plan.events[profIndex(prof)] || 0;
  const hasRoom = (prof) => eventsOf(prof) < prof.max_events;

  function reasonsFor(pair, month) {
    const out = [];
    if (pair.lectures.length) {
      const [rank, title] = pair.lectures[0];
      out.push(["✓", `Gives the club's ${Engine.ordinal(rank)}-choice talk: <b>${esc(title)}</b>`]);
    } else out.push(["✓", `Speaks on the club's ${Engine.ordinal(pair.choice_rank)}-choice topic: <b>${esc(pair.shared_themes[0])}</b>`]);
    out.push(["✓", `Both are free in <b>${monthsText(pair.shared_months)}</b>${month ? `. Suggested month: <b>${esc(month)}</b>` : ""}`]);
    if (pair.shared_formats.length) out.push(["✓", `Happy to do the club's format: ${esc(pair.shared_formats.join("; "))}`]);
    if (pair.travel) out.push(["✓", "Said they'd like to visit this area"]);
    if (pair.repeat) out.push(["!", "Spoke to this club in the last four years. You may want to choose one of the other speakers below."]);
    return out;
  }

  function clubDetail() {
    const m = R().plan.matches.find((x) => x.pair.club.id === state.sel);
    if (!m) return `<div class="card-b muted">Click a club on the left to see its details.</div>`;
    const { pair } = m, club = pair.club, prof = pair.prof;
    const shared = new Set(pair.shared_months), cm = new Set(club.months);
    const c = R().grid.clubs.indexOf(club);
    const alts = R().grid.forClub(c).filter((p) => p.allowed && p.prof !== prof).sort((a, b) => b.score - a.score).slice(0, 4);
    return `<div class="card-b detail">
      <div><div class="lead">${esc(club.name)}${club.region ? " · " + esc(club.region) : ""}</div><h2>${esc(prof.name)}</h2><div class="sub">${esc(titleOf(prof))} · booked for ${eventsOf(prof)} of the ${plural(prof.max_events, "event")} they offered</div></div>
      <div class="sec"><h3>Why this speaker</h3><ul class="reasons">${reasonsFor(pair, m.suggested_month).map(([ic, t]) => `<li><span class="ic ${ic === "!" ? "w" : ""}">${ic}</span><span>${t}</span></li>`).join("")}</ul></div>
      <div class="sec"><h3>Months</h3>
        <div class="cal">${MONTHS.map((mo) => `<div class="${mo === m.suggested_month ? "both pick" : shared.has(mo) ? "both" : cm.has(mo) ? "club" : ""}" title="${mo}">${mo.slice(0, 3)}</div>`).join("")}</div>
        <div class="cal-key"><span><i class="both pick"></i>Suggested</span><span><i class="both"></i>Both free</span><span><i class="club"></i>Only the club is free</span><span><i></i>Club not free</span></div></div>
      ${club.comments ? `<div class="sec"><h3>Note from the club</h3><p class="quote">${esc(club.comments)}</p></div>` : ""}
      <label class="keep"><input type="checkbox" id="keep" data-club="${esc(club.id)}" data-prof="${esc(prof.name)}" ${m.pinned ? "checked" : ""}> Keep ${esc(lastName(prof.name))} for ${esc(club.name)}, even if I change settings</label>
      <div class="sec"><h3>Other speakers who could do this</h3>
        ${alts.length ? `<div class="options">${alts.map((a) => `<div class="option">
            <div><div class="nm">${esc(a.prof.name)}</div><div class="sub">${a.lectures.length ? `${Engine.ordinal(a.lectures[0][0])}-choice talk: ${esc(a.lectures[0][1])}` : `${Engine.ordinal(a.choice_rank)}-choice topic: ${esc(a.shared_themes[0])}`} · free ${monthsText(a.shared_months)}</div>
              <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">${hasRoom(a.prof) ? `<span class="tag good">Available</span>` : `<span class="tag plain">Already booked elsewhere</span>`}${a.repeat ? `<span class="tag warn">Spoke here recently</span>` : ""}</div></div>
            <button class="btn small" type="button" data-pin="${esc(club.id)}" data-prof="${esc(a.prof.name)}">Choose instead</button></div>`).join("")}</div>
          <p class="small muted">If you choose someone who is already booked elsewhere, that other club gets a new suggestion automatically.</p>`
        : `<p class="muted">No other faculty member fits this club's months and topics.</p>`}
      </div>
      <details class="more"><summary>How the match score was worked out</summary>${scoreMath(pair)}</details>
    </div>`;
  }

  function scoreMath(pair) {
    const w = R().grid.weights, n = (x) => Number(x.toFixed(2));
    const cf = (r) => (r === null ? 1 : Math.max(0.2, 1 - 0.1 * w.choice_rank * (r - 1)));
    const lec = pair.lectures.reduce((s, [r]) => s + cf(r), 0) * 10 * w.lecture_match;
    const th = 5 * w.theme_match * pair.shared_themes.length * cf(pair.choice_rank);
    const mo = 2 * w.month_overlap * pair.shared_months.length, fo = 1 * w.format_match * pair.shared_formats.length;
    const club = pair.club;
    return `<table class="math">
      <tr><td>Talks the club asked for (${pair.lectures.length}, earlier choices count more)</td><td>${n(lec)}</td></tr>
      <tr><td>Topics in common (${pair.shared_themes.length})</td><td>${n(th)}</td></tr>
      <tr><td>Months both are free (${pair.shared_months.length})</td><td>${n(mo)}</td></tr>
      <tr><td>Talk formats in common (${pair.shared_formats.length})</td><td>${n(fo)}</td></tr>
      ${pair.fit - (lec + th + mo + fo) > 0.05 ? `<tr><td>Your team's pick</td><td>${n(pair.fit - (lec + th + mo + fo))}</td></tr>` : ""}
      <tr><td>Times club priority (size ${esc(club.size || "unknown")}, engagement ${club.engagement ?? "unknown"})</td><td>× ${pair.priority.toFixed(2)}</td></tr>
      <tr><td>Times senior speaker boost${pair.priority >= 0.7 ? "" : " (only for top clubs)"}</td><td>× ${pair.boost.toFixed(2)}</td></tr>
      <tr class="total"><td>Match score</td><td>${pair.score.toFixed(1)}</td></tr></table>
      <p class="small muted" style="margin-top:8px">Higher means a better fit. The ${esc(R().plan.label)} plan also weighs serving every club, each club's ranking, repeat speakers and spreading talks across faculty.</p>`;
  }

  function profRows() {
    const r = R(), allowedBy = new Map();
    for (const [, p] of r.grid.allowed()) allowedBy.set(p, (allowedBy.get(p) || 0) + 1);
    return r.grid.profs.map((prof, p) => {
      const n = r.plan.events[p] || 0;
      const status = !prof.lectures.length ? "No lectures on file" : !allowedBy.get(p) ? "No club fits" : n === 0 ? "Available, unassigned" : n >= prof.max_events ? "Full" : "Has room";
      return { prof, p, n, status, booked: r.plan.matches.filter((m) => m.pair.prof === prof) };
    }).sort((a, b) => (b.n - a.n) || (a.prof.name < b.prof.name ? -1 : 1));
  }

  function reviewProfs() {
    const rowsAll = profRows();
    const q = state.q.trim().toLowerCase();
    const rows = rowsAll.filter((x) => !q || [x.prof.name, x.booked.map((m) => m.pair.club.name).join(" ")].join(" ").toLowerCase().includes(q));
    if (!state.selProf || !rowsAll.some((x) => x.prof.name === state.selProf)) state.selProf = (rowsAll[0] || { prof: {} }).prof.name;
    const plain = { "Full": ["good", "All events booked"], "Has room": ["gold", "Can take more"], "Available, unassigned": ["plain", "Not booked yet"], "No club fits": ["warn", "No club fits"], "No lectures on file": ["bad", "No lectures listed"] };
    const list = rows.map((x) => `<tr class="row" data-prof-sel="${esc(x.prof.name)}" aria-selected="${x.prof.name === state.selProf}" tabindex="0">
        <td><div class="who">${esc(x.prof.name)}</div><div class="sub">${esc(titleOf(x.prof))}</div></td>
        <td><div class="load">${Array.from({ length: x.prof.max_events }, (_, k) => `<i class="${k < x.n ? "on" : ""}"></i>`).join("")}</div><div class="sub">${x.n} of ${x.prof.max_events} events</div></td>
        <td style="text-align:right"><span class="tag ${plain[x.status][0]}">${plain[x.status][1]}</span></td></tr>`).join("");
    const x = rowsAll.find((y) => y.prof.name === state.selProf);
    let detail = `<div class="card-b muted">Click a speaker on the left to see their details.</div>`;
    if (x) {
      const prof = x.prof, grid = R().grid;
      const fits = grid.clubs.map((club, c) => grid.at(c, x.p)).filter((pair) => pair.allowed && !x.booked.some((m) => m.pair === pair)).sort((a, b) => b.score - a.score).slice(0, 6);
      const why = x.status === "No lectures on file" ? "This person isn't in the lecture list, so they can't be matched. Add their lectures to the lecture spreadsheet."
        : x.status === "No club fits" ? "None of the clubs asked for their topics in months they're free."
        : "Not booked yet. Other speakers were a closer fit for the clubs that want these topics.";
      detail = `<div class="card-b detail">
        <div><div class="lead">${esc(titleOf(prof))}</div><h2>${esc(prof.name)}</h2><div class="sub">Offered ${plural(prof.max_events, "event")} · free ${monthsText(prof.months)}</div></div>
        <div class="sec"><h3>Booked with</h3>${x.booked.length ? `<ul class="reasons">${x.booked.map((m) => `<li><span class="ic">✓</span><span><b>${esc(m.pair.club.name)}</b>${m.suggested_month ? ` · ${esc(m.suggested_month)}` : ""}<br><span class="sub">${esc(m.pair.lectures.map((l) => l[1]).join("; ") || m.pair.shared_themes.join("; "))}</span></span></li>`).join("")}</ul>` : `<p class="muted">${why}</p>`}</div>
        <div class="sec"><h3>Lectures they offer</h3><ul class="notes">${prof.lectures.map((l) => `<li>${esc(l.title)}</li>`).join("") || "<li>None listed</li>"}</ul></div>
        ${fits.length ? `<div class="sec"><h3>Other clubs that could host them</h3><div class="options">${fits.map((pair) => `<div class="option"><div><div class="nm">${esc(pair.club.name)}</div><div class="sub">free ${monthsText(pair.shared_months)}</div></div><button class="btn small" type="button" data-pin="${esc(pair.club.id)}" data-prof="${esc(prof.name)}">Book for this club</button></div>`).join("")}</div></div>` : ""}
        ${prof.travel_wishes ? `<div class="sec"><h3>Where they'd like to travel</h3><p class="quote">${esc(prof.travel_wishes)}</p></div>` : ""}
      </div>`;
    }
    return `<div class="review">
      <div class="card listcard">
        <div class="tools"><input class="search" id="q" type="search" placeholder="Find a speaker or club" value="${esc(state.q)}" aria-label="Find a speaker or club">${viewToggle()}</div>
        <div class="scroll"><table class="list"><thead><tr><th>Speaker</th><th>Events</th><th></th></tr></thead><tbody>${list}</tbody></table></div>
      </div>
      <div class="card" id="detail">${detail}</div>
    </div>`;
  }

  // ======================================================== step 4: fix
  const PROBLEMS = {
    "No request form submitted": ["These clubs didn't send a request form", ["Contact each club to see whether they'd like a speaker this year.", "If they would, suggest one of the speakers below who still have open slots (speakers who asked to visit that city are listed first).", "Or add their request to the club spreadsheet and add it again in Step 1. Everything re-matches automatically."], "bad"],
    "Missing availability": ["These clubs didn't say which months they can host", ["Contact each club and ask which months work.", "Add the months to the Availability column in the club spreadsheet, then add it again in Step 1."], "bad"],
    "No themes or lectures requested": ["These clubs didn't pick a talk or topic", ["Ask each club to choose up to five talks from the lecture list.", "Add them to the club spreadsheet, then add it again in Step 1."], "bad"],
    "All suitable professors are fully booked": ["Good speakers exist, but they're already fully booked", ["Book one of the speakers below anyway (the club they move from gets a new suggestion), or", "ask a speaker whether they could do one more event, then raise their number in the faculty spreadsheet."], "warn"],
    "Left out so suitable professors are not overloaded": ["A speaker fits, but would be taking on an extra talk", ["The plan held back so faculty aren't overloaded. If you're happy for a speaker to do more, book them below.", "To do this automatically, lower “Share talks across faculty” on the Final plan page."], "warn"],
    "No shared months with any professor": ["No speaker is free in the months these clubs picked", ["Ask the club whether other months would work, or ask a speaker about their availability."], "warn"],
    "No content overlap with any available professor": ["No speaker offers what these clubs asked for", ["Ask the club to pick a different talk from the lecture list. The closest speakers are listed."], "warn"],
  };

  function suggestionLine(u, name, note) {
    const r = R(), c = r.grid.clubs.indexOf(u.club), p = r.grid.profs.findIndex((x) => x.name === name);
    const pair = p >= 0 ? r.grid.at(c, p) : null;
    let sub;
    if (note.startsWith("still free: ")) sub = cap(note.slice(12));
    else if (note.startsWith("near miss: ")) sub = `Close, but ${note.slice(11)}`;
    else if (pair) sub = `${pair.lectures.length ? `${Engine.ordinal(pair.lectures[0][0])}-choice talk` : `${Engine.ordinal(pair.choice_rank)}-choice topic`} · free ${monthsText(pair.shared_months)} · ${hasRoom(pair.prof) ? "available" : "fully booked"}`;
    else sub = note;
    const bookable = pair && pair.allowed;
    return `<div class="option"><div><div class="nm">${esc(name)}</div><div class="sub">${esc(sub)}</div></div>
      ${bookable ? `<button class="btn small" type="button" data-pin="${esc(u.club.id)}" data-prof="${esc(name)}">Book this speaker</button>` : `<span class="tag plain">${note.startsWith("still free") ? "Suggest to the club" : "Not a full fit"}</span>`}</div>`;
  }

  const ISSUE_TYPES = [["all", "Everything"], ["error", "Must fix"], ["warning", "Worth a look"], ["info", "For your information"]];
  function issuesCard(data) {
    const issues = Engine.dataIssues(data);
    const counts = { all: issues.length };
    for (const i of issues) counts[i.severity] = (counts[i.severity] || 0) + 1;
    const shown = issues.filter((i) => state.issueView === "all" || i.severity === state.issueView);
    const tone = { error: "bad", warning: "warn", info: "plain" };
    return `<div class="card"><div class="card-h"><h2>Things we noticed in your spreadsheets</h2>
        <div class="seg" role="group" aria-label="Show">${ISSUE_TYPES.filter(([k]) => counts[k]).map(([k, l]) => `<button type="button" data-issues="${k}" aria-pressed="${state.issueView === k}">${l} (${counts[k]})</button>`).join("")}</div></div>
      <div class="card-b">${shown.length ? `<table class="list issues"><tbody>${shown.map((i) => `<tr><td style="width:1%"><span class="tag ${tone[i.severity]}">${ISSUE_TYPES.find((t) => t[0] === i.severity)[1]}</span></td><td><b>${esc(i.subject)}</b><div class="sub">${esc(i.message)}</div></td></tr>`).join("")}</tbody></table>` : `<p class="muted">Nothing here. The spreadsheets look clean.</p>`}
      <p class="small muted" style="margin-top:10px">Names spelled differently between files were matched for you. Fixing the spelling in the spreadsheets keeps next year's run clean.</p></div></div>`;
  }

  function stepFix() {
    const { plan, data } = R();
    const groups = {};
    plan.unmatched.forEach((u) => (groups[u.reason] = groups[u.reason] || []).push(u));
    const blocks = Object.entries(groups).map(([k, list]) => {
      const [title, todo, tone] = PROBLEMS[k] || [k, [], "plain"];
      return `<div class="card">
        <div class="card-h"><h2>${title}</h2><span class="tag ${tone}">${plural(list.length, "club")}</span></div>
        <div class="card-b"><b>What to do</b><ol class="todo-steps">${todo.map((t) => `<li>${t}</li>`).join("")}</ol></div>
        ${list.map((u, i) => `<details class="problem" ${i === 0 ? "open" : ""}><summary><span><b>${esc(u.club.name)}</b> <span class="sub">${esc(u.club.region)}${u.club.months.length ? ` · free ${monthsText(u.club.months)}` : ""}</span></span>
            <span class="sub">${u.suggestions.length ? plural(u.suggestions.length, "speaker") + " to try" : "No speaker to try"}</span></summary>
          ${u.club.requests.length ? `<div class="sub">Asked for: ${esc(u.club.requests.map((q) => q.title || q.theme).join("; "))}</div>` : ""}
          ${u.suggestions.length ? `<div class="options">${u.suggestions.map(([n, note]) => suggestionLine(u, n, note)).join("")}</div>` : ""}</details>`).join("")}
      </div>`;
    }).join("");
    const pinNotes = plan.pin_notes.length ? `<div class="banner err">${plan.pin_notes.map(esc).join(" ")}</div>` : "";
    const body = plan.unmatched.length
      ? `${pinNotes}<div class="fixes">${blocks}${issuesCard(data)}</div>`
      : `${pinNotes}<div class="banner">Every club has a speaker. There's nothing to fix.</div>${issuesCard(data)}`;
    const n = plan.unmatched.length;
    return frame("Step 4: Help the clubs that don't have a speaker yet", body,
      n ? `${plural(n, "club")} couldn't be matched. They're grouped by reason below, with what to do for each. You can also go on and handle these later.` : "Every club has a suggested speaker.",
      ["review", "Back"], ["results", "Next: Final plan"]);
  }

  // ======================================================== step 5: final plan, tweak and download
  function tweakPanel() {
    const lv = state.opts.levels, preset = matchingPreset(lv);
    return `<div class="card tweak"><div class="card-h"><h2>Fine-tune</h2>${changedLevels().length ? `<button class="link small" type="button" id="t-reset">Back to standard</button>` : `<span class="tag good">Standard</span>`}</div>
      <div class="card-b tweak-b">
        <p class="small muted">Change anything here and the plan, numbers and charts update straight away.</p>
        <label class="colpick"><span>Plan</span><select id="t-plan">${PLAN_ORDER.map((k) => `<option value="${k}" ${state.opts.plan === k ? "selected" : ""}>${esc(Engine.MODES[k].label)}</option>`).join("")}</select></label>
        <label class="colpick"><span>Quick setting</span><select id="t-preset"><option value="" ${preset ? "" : "selected"}>Custom</option>${Object.keys(PRESETS).map((n) => `<option ${preset === n ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        ${PRIORITIES.map(([, title, items]) => `<details class="tgroup"><summary>${title}</summary>${items.map(([k, label, summary, , explain]) => `<div class="prio">
          <div class="prio-h"><span><b>${esc(label)}</b><span class="sub">${esc(summary)}</span></span>
            <select data-level="${k}" aria-label="${esc(label)}">${LEVELS.map((l) => `<option ${lv[k] === l ? "selected" : ""}>${l}</option>`).join("")}</select></div>
          <details class="what"><summary>What does this do?</summary><p>${esc(explain)}</p></details></div>`).join("")}</details>`).join("")}
        <div class="tweak-io"><button class="btn small" type="button" id="save-settings">Save my settings</button><button class="btn small" type="button" id="load-settings">Load saved settings</button></div>
      </div></div>`;
  }

  function stepResults() {
    const { plan } = R(), s = plan.summary, base = baseline(), b = base.summary;
    const delta = (k, higher) => { const d = s[k] - b[k]; return d ? `<span class="d ${(d > 0) === higher ? "good" : "bad"}" title="Compared with standard settings">${d > 0 ? "+" : "−"}${Math.abs(d)}</span>` : ""; };
    const basePairs = new Map(base.matches.map((m) => [m.pair.club.id, m.pair.prof.name]));
    const changed = plan.matches.filter((m) => basePairs.get(m.pair.club.id) !== m.pair.prof.name).length
      + base.matches.filter((m) => !plan.matches.some((x) => x.pair.club.id === m.pair.club.id)).length;
    const kpis = `<div class="kpis">
      <div class="card stat"><span>Clubs with a speaker</span><b>${s.clubs_matched}${delta("clubs_matched", true)} <small>of ${s.clubs_total}</small></b></div>
      <div class="card stat"><span>Got the talk they ranked 1st</span><b>${s.first_choice_lectures}${delta("first_choice_lectures", true)}</b></div>
      <div class="card stat"><span>Repeat speakers</span><b>${s.repeat_speakers}${delta("repeat_speakers", false)}</b></div>
      <div class="card stat"><span>Faculty giving talks</span><b>${s.profs_used}${delta("profs_used", true)}</b></div></div>`;
    const ms = plan.matches;
    const tabs = [["month", "Talks by month"], ["choice", "Club's ranking of its talk"], ["region", "Talks by region"], ["busy", "Busiest professors"]];
    const chart = {
      month: () => bars(countsOf(ms.map((m) => m.suggested_month), MONTHS), { unit: "talks" }),
      choice: () => bars(countsOf(ms.map((m) => (m.pair.lectures.length ? Engine.ordinal(m.pair.lectures[0][0]) + " choice" : "Same topic, other talk")), ["1st choice", "2nd choice", "3rd choice", "4th choice", "5th choice", "Same topic, other talk"]), { unit: "clubs" }),
      region: () => bars(countsOf(ms.map((m) => m.pair.club.region || "No region")), { unit: "talks" }),
      busy: () => bars(countsOf(ms.map((m) => m.pair.prof.name)).slice(0, 10), { unit: "talks" }),
    }[state.resTab]();
    const changedLine = changed || changedLevels().length || state.pins.length
      ? `<p class="small muted">${changed ? `${plural(changed, "club has", "clubs have")} a different speaker than the ${esc(plan.label)} plan with standard settings.` : (state.opts.plan === "recommended" ? "Your changes didn't move any speakers. Recommended always serves the most clubs and 1st choices first, so priorities only break ties. Pick Best fit or Balanced under Plan to see priorities make a bigger difference." : "Your changes didn't move any speakers.")} The small green and red numbers compare with standard settings.</p>` : "";
    const body = `<div class="results">
      ${tweakPanel()}
      <div class="res-main">
        ${kpis}
        ${changedLine}
        <div class="card dlcard"><div class="card-b dlrow">
          <div><b>Download the final plan</b><div class="sub">One Excel file: matches, clubs that need attention, each speaker's load, all plans compared, a data check and the settings used.</div></div>
          <div class="dlbtns"><button class="btn primary" type="button" id="dl-xlsx">Download Excel workbook</button><button class="btn small" type="button" id="dl-csv">Matches only (CSV)</button></div>
          <p class="small muted" id="dl-note" hidden>Saving files isn't available in this view. Open the page in your browser to download.</p></div></div>
        <div class="card"><div class="card-h"><h2>The ${esc(plan.label)} plan at a glance</h2>
          <div class="seg" role="group" aria-label="Chart">${tabs.map(([k, l]) => `<button type="button" data-restab="${k}" aria-pressed="${state.resTab === k}">${l}</button>`).join("")}</div></div>
          <div class="card-b chart-b">${chart}</div></div>
      </div></div>`;
    return frame("Step 5: Your final plan", body,
      "Here's the finished plan. Try different settings under Fine-tune to see what works best: the numbers and charts update as you go. When you're happy, download it.",
      ["fix", "Back"], null);
  }

  // ======================================================== overlays
  function openModal(html) {
    const o = $("#overlay");
    o.innerHTML = html; o.hidden = false;
    o.onclick = (e) => { if (e.target === o) closeModal(); };
    $$("[data-close]", o).forEach((b) => b.onclick = closeModal);
    const f = $(".x", o); if (f) f.focus();
    return o;
  }
  function closeModal() { $("#overlay").hidden = true; $("#overlay").innerHTML = ""; }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#overlay").hidden) closeModal(); });

  function settingsPriorities(lv, preset) {
    return `<div class="q"><b>Quick setting</b><select id="m-preset" class="wide-select"><option value="" ${preset ? "" : "selected"}>Custom</option>${Object.keys(PRESETS).map((n) => `<option ${preset === n ? "selected" : ""}>${n}</option>`).join("")}</select>
      <span class="small muted">These decide who wins when two clubs want the same speaker. “Standard” is what most people should use.</span></div>
      ${PRIORITIES.map(([, title, items]) => `<div class="q"><b>${title}</b><div class="prios">${items.map(([k, label, summary, , explain]) => `<div class="prio">
        <div class="prio-h"><span><b>${esc(label)}</b><span class="sub">${esc(summary)}</span></span>
          <select data-level="${k}" aria-label="${esc(label)}">${LEVELS.map((l) => `<option ${lv[k] === l ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <details class="what"><summary>What does this do?</summary><p>${esc(explain)}</p></details></div>`).join("")}</div></div>`).join("")}`;
  }

  function settingsColumns() {
    const r = R();
    if (!r || !r.data) return `<p class="muted">Add your files in Step 1 first. Then you can check which column the matcher reads for each piece of information.</p>`;
    return `<p class="muted small">You only need this if a spreadsheet's column names changed. The matcher finds columns by name and handles small changes on its own.</p>
      ${FILES.map(([g, name]) => `<details class="more colsec"><summary>${name}</summary><div class="colgrid">
        ${Engine.COLUMN_SPEC[g].map((spec) => columnPicker(g, spec, r.data.columns[g][spec.field], r.data.headers[g])).join("")}</div></details>`).join("")}`;
  }

  function openSettings() {
    const pending = { levels: Object.assign({}, state.opts.levels), columns: JSON.parse(JSON.stringify(state.columns)) };
    const tabs = [["prio", "Priorities"], ["cols", "Spreadsheet columns"]];
    const body = () => (state.setTab === "prio" ? settingsPriorities(pending.levels, matchingPreset(pending.levels)) : settingsColumns());
    const m = openModal(`<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="set-t">
      <div class="modal-h"><div><h2 id="set-t">Settings</h2><p class="muted small">Most people never need to change these. The recommended settings are already on.</p></div><button class="x" type="button" data-close aria-label="Close">×</button></div>
